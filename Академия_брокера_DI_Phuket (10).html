<tr><td>Negotiation</td><td>Terms, questions, objections</td><td>Agreed terms</td><td>The client is ready for a viewing or reservation</td></tr>
<tr><td>Viewing</td><td>Online or in person</td><td>Date, outcome</td><td>The client has confirmed the choice</td></tr>
<tr><td>Reservation</td><td>Deposit, reservation agreement</td><td>Amount, date, property</td><td>The deposit has been received</td></tr>
<tr><td>Deal</td><td>Contract, payment, registration</td><td>Payment schedule, status</td><td>Registration is complete</td></tr>
<tr><td>After-sales support</td><td>Management, service, repeat sales</td><td>Management agreement</td><td>—</td></tr></table>
<h3>The rule</h3><p>Do not skip stages: a proposal sent without qualification almost always misses.</p>`,
 example:`<p>A client immediately asks for “villa prices”. The broker gives a short guideline and suggests a 5-minute call to understand the goal — and only then prepares a selection.</p>`,
 checklist:['I know the 9 stages','I know the required data for each stage','I know the conditions for moving on'],
 quiz:[
  {q:'When does a client move from “Qualification” to “Selection”?', o:['Right after the enquiry','When the goal, budget, timing, area and type are clear','After the reservation','When the client asks for a discount'], a:[1], e:'Without a clear request the selection misses.'},
  {q:'Which data is required at the “Reservation” stage?', o:['The colour of the furniture','Amount, date, property','The client’s hobbies','A review'], a:[1], e:'We record the facts of the reservation.'},
  {q:'May a proposal be sent before qualification?', o:['Yes, always','As a rule, no — the proposal misses','Only to VIPs','Only in the evening'], a:[1], e:'Do not skip stages.'}
 ],
 criteria:['Mini-check passed'], links:[]
},
{
 id:'4.2', title:'Client sources', min:10,
 goal:'Know where clients come from and take the features of each source into account.',
 why:'A client from a recommendation and a client from an ad behave differently. The source suggests how to start the conversation.',
 material:`
<table class="tbl"><tr><th>Source</th><th>Feature</th><th>How to start</th></tr>
<tr><td>Website enquiry</td><td>The client already knows the company</td><td>Thank them, clarify the request</td></tr>
<tr><td>Advertising</td><td>Interest in a specific offer</td><td>Start with the advertised property, then widen</td></tr>
<tr><td>Messengers (Telegram, WhatsApp)</td><td>Expect a quick, short reply</td><td>Briefly, 1–2 questions</td></tr>
<tr><td>Company Instagram, YouTube</td><td>Warm interest in the content</td><td>Refer to the content</td></tr>
<tr><td>Recommendations</td><td>High trust</td><td>Mention the person who recommended you</td></tr>
<tr><td>Partners</td><td>Agreements with the partner</td><td>Follow the partnership rules</td></tr>
<tr><td>Returning clients</td><td>Already know the process</td><td>Find out the new goal</td></tr></table>
<p><span class="tbc">The company’s actual lead sources and their shares — to be confirmed with marketing.</span></p>
<p><b>Important:</b> mailings and “cold” messages only with the recipient’s consent or another legal basis.</p>`,
 example:`<p>An enquiry from a recommendation: “Hello, Irina! Alexey gave me your contact — we helped him buy in Bang Tao. Tell me what you are looking for.”</p>`,
 checklist:['I know the 7 sources','I know how to start a conversation for each','I do not send mailings without consent'],
 quiz:[
  {q:'A client came via a recommendation. How do you start?', o:['Like with anyone else','Mention the person who recommended you','Send a price list right away','Ask about the budget first'], a:[1], e:'We use the trust of the recommendation.'},
  {q:'May you send a mass mailing to a purchased database?', o:['Yes','No, only with consent or another legal basis','Yes, at night','Yes, if it is short'], a:[1], e:'A requirement of the brief and the law.'},
  {q:'A client writes on WhatsApp. Reply style:', o:['A long letter','Briefly, 1–2 questions','No reply until a call','A 5-minute voice message'], a:[1], e:'Messengers call for a short format.'}
 ],
 criteria:['Mini-check passed'], links:[]
},
{
 id:'4.3', title:'First contact', min:20,
 goal:'Be able to start a conversation quickly and professionally in any channel and agree on a next step.',
 why:'The first minutes decide whether an enquiry becomes a client. Speed and tone matter more than a long story about the company.',
 material:`
<h3>The structure of a first contact</h3>
<ol><li><b>Speed:</b> reply as fast as possible.</li><li><b>Greeting and introduction:</b> name, company.</li><li><b>Rapport:</b> thank them and show you have read the request.</li><li><b>Purpose:</b> 1–2 open questions.</li><li><b>Next step:</b> a call or a selection — at a specific time.</li></ol>
<h3>Templates</h3>
<p><b>Telegram / WhatsApp:</b></p><div class="tpl">Hello, [Name]! My name is [Name], I am a broker at DI Phuket Property. Thank you for your enquiry about [property/request]. Are you considering a purchase to live in, for holidays or to rent out? I could have a quick call with you today at [time] and send 3–5 suitable options.</div>
<p><b>Email:</b></p><div class="tpl"><b>Subject:</b> Your Phuket property enquiry<br>Dear [Name], thank you for contacting DI Phuket Property. To select options that suit you exactly, could you tell me the purpose of the purchase, your approximate budget and timing? I suggest a 15-minute call at a convenient time — for example, [two options]. Kind regards, [Name, contacts]</div>
<p><b>Phone:</b></p><div class="tpl">— Hello, is that [Name]? My name is [Name], from DI Phuket Property, you left an enquiry about [what]. Do you have two minutes? … So that I don’t send you anything unnecessary, what are you considering the purchase for? … Great. Here’s what I suggest: today I’ll put together 3–5 options, and tomorrow at [time] we’ll talk for 15 minutes. Does that work?</div>`,
 example:`<p>A mistake: “Good afternoon! DI Phuket Property was founded in 2014 and offers a full range of services…” (three paragraphs about the company). The right way: introduce yourself briefly and ask about the client.</p>`,
 checklist:['I know the 5 steps of a first contact','I can adapt the template to the channel','I end with a specific next step'],
 quiz:[
  {q:'What matters most in the first message?', o:['The company’s history','A question about the client’s goal and a next step','A price list','Links to all social networks'], a:[1], e:'The client comes first.'},
  {q:'How does a first contact end?', o:['“Write if anything”','With a specific next step and a time','With nothing','With an invoice'], a:[1], e:'A next step with a date.'},
  {q:'A call to a client starts with:', o:['A presentation','An introduction, the reason for the call and “is it a good time to talk?”','The price','A discount'], a:[1], e:'Respect for the client’s time.'}
 ],
 practice:{title:'The first message', task:'A client left an enquiry on Telegram: “Interested in apartments in Bang Tao to rent out.” Write the first message and a follow-up in case the client does not reply within a day.', criteria:['A short introduction','A question about the goal or budget','A specific next step','A follow-up without pressure']},
 criteria:['Mini-check passed','The message is accepted by the mentor'], links:[]
},
{
 id:'4.4', title:'Client qualification', min:20,
 goal:'Be able to get all the information needed for a precise selection in 10–15 minutes.',
 why:'Good qualification saves weeks of messages and builds trust: the client sees they have been understood.',
 material:`
<h3>Qualification questionnaire</h3>
<table class="tbl"><tr><th>Block</th><th>Questions</th></tr>
<tr><td>Goal</td><td>What is the purchase for: living, holidays, rental, resale? How will you use the property?</td></tr>
<tr><td>Budget</td><td>What budget is comfortable? Including transaction costs and furniture?</td></tr>
<tr><td>Timing</td><td>When do you plan to decide and buy? A finished property or under construction?</td></tr>
<tr><td>Area</td><td>Have you been to Phuket? What matters nearby: the beach, a school, quiet?</td></tr>
<tr><td>Type</td><td>Apartment, villa, number of bedrooms, view</td></tr>
<tr><td>Financing</td><td>(if appropriate) Funds available, instalments?</td></tr>
<tr><td>Decision</td><td>Who else takes part in the decision?</td></tr>
<tr><td>Expectations</td><td>What income do you expect? Over what period?</td></tr>
<tr><td>Doubts</td><td>What worries you?</td></tr></table>
<h3>Technique</h3>
<ul><li>Open questions (“what matters to you…”), then clarifying ones.</li><li>Paraphrasing: “Do I understand correctly that…?”</li><li>Don’t interrogate — weave the questions into the conversation.</li><li>Record yield expectations and correct them with facts if needed (topic 3.6).</li></ul>`,
 example:`<p>“Do I understand correctly: you are looking for a two-bedroom apartment to rent out, a budget of up to 300 thousand dollars, a decision within 3 months, your wife is also involved in the choice, and it matters that the property is finished this year?” The client confirms, and the broker makes a precise selection.</p>`,
 checklist:['I know the 9 questionnaire blocks','I use open questions and paraphrasing','I record the answers in the CRM'],
 quiz:[
  {q:'Why ask who else takes part in the decision?', o:['Out of politeness','To take into account everyone who influences the purchase and invite them to the presentation','No need','For a discount'], a:[1], e:'Otherwise the decision will stall.'},
  {q:'A client expects 20% a year. What do you do?', o:['Agree','Record it and show a realistic calculation','Argue','Ignore it'], a:[1], e:'We correct expectations with facts.'},
  {q:'What is paraphrasing?', o:['Repeating the question','Checking understanding: “Do I understand correctly that…?”','Changing the subject','Translation'], a:[1], e:'The client sees they have been understood.'}
 ],
 criteria:['Mini-check passed'], links:[]
},
{
 id:'4.5', title:'Sales scripts', min:40,
 goal:'Know ten basic conversation scenarios and typical client responses.',
 why:'A script is not a text to read out but a map of the conversation. It helps you not to miss anything important.',
 material:`
<p class="muted">The scripts are for training; adapt them to the client and do not read them word for word.</p>
<table class="tbl"><tr><th>Scenario</th><th>Goal</th><th>Key phrases and sequence</th><th>Typical mistake</th></tr>
<tr><td>1. First enquiry</td><td>Start the conversation</td><td>Introduce yourself → question about the goal → next step</td><td>Talking about the company instead of asking</td></tr>
<tr><td>2. Repeat contact</td><td>Regain attention</td><td>“You were interested in… there are new options/news about…” — only with a legal basis for contact</td><td>“Are you still thinking?”</td></tr>
<tr><td>3. Qualification call</td><td>Understand the request</td><td>Questionnaire 4.4 → paraphrasing → agreement on a selection</td><td>Interrogation without rapport</td></tr>
<tr><td>4. Investor consultation</td><td>Show the economics</td><td>Goals → 2–3 properties → scenario calculation → risks → next step</td><td>Promising yield</td></tr>
<tr><td>5. Property presentation</td><td>Help choose</td><td>Location → property → figures → pros and limitations → question</td><td>Only the pros</td></tr>
<tr><td>6. Invitation to a viewing</td><td>Move to a viewing</td><td>“So that you can see it live, I suggest an online tour on Thursday or a visit during your trip”</td><td>“Write if you want to”</td></tr>
<tr><td>7. Return after a pause</td><td>Resume contact</td><td>A reason (news, a property, a price change) → a question about current plans</td><td>Pressure</td></tr>
<tr><td>8. Follow-up after a proposal</td><td>Get feedback</td><td>“Which option is closer? What concerns you?”</td><td>Silence for weeks</td></tr>
<tr><td>9. Negotiating a reservation</td><td>Move to a reservation</td><td>Summary of the choice → reservation terms → what comes next → a date</td><td>False urgency</td></tr>
<tr><td>10. Handover to support</td><td>A smooth handover</td><td>Who joins (lawyer, management), what the client will get, the broker stays in touch</td><td>The client does not know whom to contact</td></tr></table>
<h3>An example of a good dialogue: follow-up after a proposal</h3>
<div class="tpl">— Sergey, good afternoon! You looked at the proposal for two properties in Bang Tao. Which one is closer?<br>— The second, but it’s a bit expensive.<br>— I understand. What exactly concerns you — the total price or the running costs?<br>— The total price.<br>— Then I suggest comparing it with a similar property in Layan: it is 12% cheaper, and I’ll send you the yield calculation today by 6 pm. Can we talk for 10 minutes tomorrow?</div>`,
 example:`<p>The broker uses script 6: “Anna, so that you can see the property live, I suggest an online tour with a manager on site on Thursday at 4 pm Moscow time. Does that work for you?”</p>`,
 checklist:['I know the goal of each of the 10 scripts','I know the typical mistakes','I adapt the script rather than read it'],
 quiz:[
  {q:'The goal of a follow-up after a proposal:', o:['To remind them about yourself','To get feedback and understand what concerns the client','To send 20 more properties','To lower the price'], a:[1], e:'We find out what is stopping the decision.'},
  {q:'A typical mistake in a property presentation:', o:['Mentioning the downsides','Mentioning only the upsides','Showing figures','Asking questions'], a:[1], e:'Honesty about the downsides builds trust.'},
  {q:'What matters when handing a client over to support?', o:['Disappear','The client knows who joins, and the broker stays in touch','Hand over without explanation','Ask for a review'], a:[1], e:'A smooth handover.'}
 ],
 criteria:['Mini-check passed'], links:[]
},
{
 id:'4.6', title:'Commercial proposals', min:30,
 goal:'Be able to put together a proposal in the right format using a single structure.',
 why:'A proposal is what the client forwards to a spouse, a partner or an accountant. It must sell without the broker being there.',
 material:`
<h3>Proposal structure (10 points)</h3>
<ol><li>The client’s goal and request</li><li>Recommended properties</li><li>Location</li><li>Specifications</li><li>Price and payment terms</li><li>Advantages and limitations</li><li>Investment figures (if applicable, in scenarios)</li><li>Photos and floor plans</li><li>Next step</li><li>The broker’s contacts</li></ol>
<h3>Five formats</h3>
<table class="tbl"><tr><th>Format</th><th>When</th><th>Feature</th></tr>
<tr><td>One property</td><td>The client has chosen a property</td><td>Detailed, with a calculation</td></tr>
<tr><td>Comparison of three properties</td><td>Choosing between options</td><td>A table with the same criteria</td></tr>
<tr><td>Investment</td><td>An investor</td><td>Calculation in 3 scenarios, costs, risks</td></tr>
<tr><td>Premium</td><td>A premium client</td><td>Concise, visual, confidential</td></tr>
<tr><td>Short, in a messenger</td><td>A quick reply</td><td>5–7 lines + a link</td></tr></table>
<h3>A sample short proposal in a messenger</h3>
<div class="tpl">[Name], I’ve found an option for your request (2 bedrooms, for rental):<br>📍 [Project], Bang Tao, 7 minutes to the beach<br>🏠 2 bedrooms, 78 m², ready in [date]<br>💰 [price] baht, instalments [terms]<br>📊 Training calculation: gross yield [x]% in the base scenario, costs included<br>⚠️ Limitation: [be honest]<br>Shall we talk tomorrow at [time]? I’ll show you the floor plan and the calculation.</div>
<p><span class="tbc">The company’s branded proposal template — to be confirmed/attached.</span></p>`,
 example:`<p>The broker presents a comparison of three properties as a table: price, m², price per m², area, completion, management, yield calculation, limitations. The client sees the difference in a minute.</p>`,
 checklist:['I know the 10 proposal points','I choose the format for the client','I state limitations and a next step'],
 quiz:[
  {q:'A mandatory point of any proposal:', o:['A joke','The next step','A guarantee','A discount'], a:[1], e:'A proposal without a next step is just information.'},
  {q:'Which format suits a client choosing between three options?', o:['One property','A comparison of three properties in a table','A voice message','A catalogue'], a:[1], e:'The same criteria in a table.'},
  {q:'Investment figures in a proposal are shown:', o:['As one figure “up to 30%”','In scenarios with costs','Not shown','Only verbally'], a:[1], e:'Scenarios and costs.'}
 ],
 practice:{title:'A proposal for an investor', task:'Prepare an investment proposal for the training property from topic 3.6 (6.5 million baht, rent 38,000/month) using the 10-point structure. You may attach a link to a file.', criteria:['All 10 points','A scenario calculation with costs','Honest limitations','A specific next step']},
 criteria:['Mini-check passed','The proposal is accepted by the mentor'], links:[]
},
{
 id:'4.7', title:'Handling objections', min:35,
 goal:'Be able to answer 9 typical objections without pressure or unconfirmed promises.',
 why:'An objection is a question the client has not yet had answered. Handling it well brings the client closer to a decision.',
 material:`
<h3>The algorithm</h3><ol><li><b>Listen</b> to the end.</li><li><b>Acknowledge the right to doubt</b>: “I understand, it’s an important question.”</li><li><b>Clarify</b> what exactly is behind the objection.</li><li><b>Answer with facts</b>.</li><li><b>Check</b>: “Does that answer your question?” → next step.</li></ol>
<table class="tbl"><tr><th>Objection</th><th>Clarifying question</th><th>Acceptable answer</th></tr>
<tr><td>“It’s expensive”</td><td>“Compared with what? The price or the running costs?”</td><td>Compare the price per m² with the market (topic 3.2), show cheaper alternatives with their limitations</td></tr>
<tr><td>“I need to think”</td><td>“Of course. What is the main question for you?”</td><td>Answer the main question, agree on a date</td></tr>
<tr><td>“I’ve seen it cheaper”</td><td>“Send me the link — I’ll compare it objectively”</td><td>A comparison on the same criteria: area, completion, developer, costs</td></tr>
<tr><td>“Why not buy directly from the developer?”</td><td>“What matters more to you — the price or the choice and the checks?”</td><td>Comparison of projects, legal check, management (topic 1.6)</td></tr>
<tr><td>“I don’t trust investing abroad”</td><td>“What exactly worries you?”</td><td>How ownership, money transfers and registration work; the lawyer; experience since 2014</td></tr>
<tr><td>“How is the income guaranteed?”</td><td>—</td><td>Honestly: income is not guaranteed; we show scenarios and what they depend on</td></tr>
<tr><td>“What if the property doesn’t rent?”</td><td>“What minimum income is acceptable for you?”</td><td>The cautious scenario, seasonality, the management company</td></tr>
<tr><td>“I’ll compare with another region”</td><td>“On which criteria?”</td><td>A comparison table on the client’s criteria</td></tr>
<tr><td>“Now is not the time”</td><td>“What needs to change for the time to be right?”</td><td>No pressure; agree on a later contact if the client agrees</td></tr></table>
<div class="claim">Forbidden: pressure, invented urgency, promising income, criticising competitors.</div>`,
 example:`<p><b>Client:</b> “How is the income guaranteed?”<br><b>Broker:</b> “To be honest, it isn’t: rental income depends on occupancy, the season, management and the exchange rate. That’s why I show three scenarios. In the cautious one the yield is [x]%, in the base one [y]%. Let’s see what minimum income would suit you and choose a property with a margin.”</p>`,
 checklist:['I know the 5 steps of the algorithm','I know the answers to 9 objections','I do not promise income or apply pressure'],
 quiz:[
  {q:'The first step in handling an objection:', o:['Argue','Listen to the end','Give a discount','Change the subject'], a:[1], e:'Listen first.'},
  {q:'“How is the income guaranteed?” The right answer:', o:['“We guarantee 10%”','“It isn’t guaranteed; I’ll show scenarios and what they depend on”','“Don’t worry”','“Everyone does it”'], a:[1], e:'Honesty.'},
  {q:'“I’ve seen it cheaper.” What do you do?', o:['Say it’s a scam','Ask for the link and compare on the same criteria','Lower the price','End the conversation'], a:[1], e:'An objective comparison.'}
 ],
 practice:{title:'Three objections', task:'Write dialogue answers to three objections: “It’s expensive”, “Why not buy directly from the developer?”, “What if the property doesn’t rent?”. For each, give a clarifying question, an answer and a next step.', criteria:['The 5-step algorithm is followed','There are clarifying questions','The answers are factual, without pressure or promises','There is a next step']},
 criteria:['Mini-check passed','The dialogues are accepted by the mentor'], links:[]
},
{
 id:'4.8', title:'Online and in-person presentations', min:20,
 goal:'Be able to present a property by video call and on site.',
 why:'Most clients decide remotely. The quality of an online presentation directly affects the deal.',
 material:`
<h3>Preparation</h3><ul><li>Check that price and availability are current.</li><li>Prepare the map, floor plans, photos/videos and the calculation.</li><li>Check the connection, screen sharing and sound.</li><li>Have 2–3 questions ready to ask.</li></ul>
<h3>The presentation (30–40 minutes)</h3><ol><li>Repeat the client’s goals (2 min).</li><li>Location on the map: beach, infrastructure (5 min).</li><li>The property: floor plan, view, complex (10 min).</li><li>Figures: price, costs, calculation (10 min).</li><li>Advantages <b>and limitations</b>, risks (5 min).</li><li>The client’s questions (5 min).</li><li>Confirming agreements and the next step (3 min).</li></ol>
<h3>After the meeting</h3><p>Within 2 hours send a summary: what was discussed, what the client will receive, the next step and the date. Record it in the CRM.</p>`,
 example:`<div class="tpl">“Anna, thank you for the meeting! Summary: property 2 in Layan suits you best; I’ll send a video of the view from the window by Friday and check the instalment terms. Let’s talk on Monday at 3 pm Moscow time.”</div>`,
 checklist:['I prepare using the checklist','I run the presentation in 7 steps','I send a summary after the meeting'],
 quiz:[
  {q:'What do you send after a presentation?', o:['Nothing','A summary: what was discussed, what the client will receive, the next step','An invoice','A catalogue'], a:[1], e:'We confirm the agreements.'},
  {q:'A mandatory part of a presentation:', o:['Only the pros','Advantages and limitations','Jokes','A discount'], a:[1], e:'Honesty.'},
  {q:'How should a presentation start?', o:['With the price','With repeating the client’s goals','With the company’s history','With photos'], a:[1], e:'The client sees they were heard.'}
 ],
 criteria:['Mini-check passed'], links:[]
},
{
 id:'4.9', title:'Negotiation and deal support', min:20,
 goal:'Be able to take a client from choice to registration, coordinating all participants.',
 why:'At the deal stage clients are especially anxious. Clarity and control of deadlines are the broker’s main value.',
 material:`
<table class="tbl"><tr><th>Stage</th><th>The broker’s role</th></tr>
<tr><td>Agreeing terms</td><td>Price, schedule, furniture, timing; anything beyond your authority goes through the manager</td></tr>
<tr><td>Handling doubts</td><td>Answer questions, do not rush the client</td></tr>
<tr><td>Reservation</td><td>Explain the reservation terms and deposit refund (<span class="tbc">rules to be confirmed</span>)</td></tr>
<tr><td>Legal check</td><td>Pass the data to the lawyer, keep the client informed</td></tr>
<tr><td>Document control</td><td>List of documents, deadlines</td></tr>
<tr><td>Payment</td><td>Schedule; for a condo — a currency transfer from abroad and an FET (topic 3.7). Money goes only to the bank details in the contract, never to the broker personally</td></tr>
<tr><td>Developer</td><td>Coordinating deadlines and documents</td></tr>
<tr><td>Status updates to the client</td><td>Regularly, even if “nothing has changed”</td></tr></table>`,
 example:`<p>A weekly message: “Ivan, status update: the lawyer has finished the check, no issues. The contract will be ready on Wednesday, I’ll send it for your review. The next scheduled payment is on the 15th.”</p>`,
 checklist:['I know the broker’s role at each stage of the deal','Money goes only according to the contract','I report status regularly'],
 quiz:[
  {q:'A client wants to transfer the deposit to the broker’s card “to speed things up”. What do you do?', o:['Accept it','Refuse: payment only to the bank details in the contract','Accept cash','Ask a colleague'], a:[1], e:'The broker does not accept money personally.'},
  {q:'How often should you update the client on the deal status?', o:['Only when something changes','Regularly, even if nothing has changed','Never','At the end'], a:[1], e:'Regular updates reduce anxiety.'},
  {q:'A client asks for a furniture discount beyond your authority. You:', o:['Agree','Agree it with the manager','Refuse sharply','Ignore it'], a:[1], e:'Decisions beyond your authority go to the manager.'}
 ],
 criteria:['Mini-check passed'], links:[]
},
{
 id:'4.10', title:'Client service', min:15,
 goal:'Maintain relationships after the deal, handle complaints and get recommendations.',
 why:'A satisfied client brings new ones. Long-term work is part of the company’s positioning.',
 material:`
<ul><li><b>After the deal:</b> congratulate the client, hand over to management, ask about their impressions a month later.</li>
<li><b>Transparency:</b> answer honestly, even if the news is bad.</li>
<li><b>Complaints:</b> listen, record, pass to the manager the same day (topic 1.8), tell the client when to expect an answer.</li>
<li><b>Repeat sales:</b> a second property, an exchange, selling the client’s property.</li>
<li><b>Recommendations:</b> ask when the client is happy with the result.</li>
<li><b>Reputation:</b> every promise is kept on time.</li></ul>`,
 example:`<p>Three months after the deal the broker writes: “Oleg, how was your first rental season? Did you get the report from the management company? If you have any questions, I’m here.” Six months later the client recommends the broker to a friend.</p>`,
 checklist:['I know the 6 service rules','I know how to handle a complaint'],
 quiz:[
  {q:'A client complains about property management. First action:', o:['Make excuses','Listen, record, pass to the manager, give a response time','Ignore it','Blame the management company'], a:[1], e:'The escalation procedure.'},
  {q:'When should you ask for a recommendation?', o:['On the first call','When the client is happy with the result','Never','During a complaint'], a:[1], e:'At the moment of satisfaction.'},
  {q:'What does working for the long term mean?', o:['Long negotiations','A relationship with the client after the deal too','Working slowly','Long proposals'], a:[1], e:'The company’s positioning.'}
 ],
 criteria:['Mini-check passed'], links:[]
}
];
const B4_TEST = [
 {q:'The order of funnel stages:', o:['Selection → qualification → enquiry','Enquiry → qualification → selection → presentation','Reservation → selection → presentation','Deal → qualification'], a:[1], e:'See 4.1.'},
 {q:'A first contact ends with:', o:['An invoice','A specific next step','A catalogue','Nothing'], a:[1], e:'See 4.3.'},

<h4>Standard: how a broker presents the company</h4>
<p><b>Purpose.</b> A single “company passport” in spoken and written form, so that all brokers describe DI Phuket Property the same way and only with verified facts.</p>
<p><b>Three versions of the introduction</b> (learn them by the end of day 1):</p>
<table class="tbl"><tr><th>Version</th><th>Where it is used</th><th>Content</th></tr>
<tr><td>10 seconds</td><td>First message, start of a call</td><td>Name, company, “a full-cycle agency in Phuket since 2014”</td></tr>
<tr><td>30 seconds</td><td>First call</td><td>+ business lines (apartments, villas, hotels, land) + management after the purchase</td></tr>
<tr><td>90 seconds</td><td>Investor consultation</td><td>+ the founder is a developer + the investment approach + an example deal (if approved)</td></tr></table>
<h4>Procedure: fact-check before mentioning</h4>
<ol><li>The fact is in the “Guide to the company” (knowledge base) → you may say it.</li>
<li>The fact is not in the guide but is on the website → you may quote it with “according to our website”, except yield figures.</li>
<li>The fact is in neither → do not say it; check with the manager.</li></ol>
<h4>Situations</h4>
<p><b>Client: “How many deals have you done?”</b> There is no exact figure in open sources. Answer: “The company has been working since 2014 and has handled deals from apartments to hotels. I’ll check the exact statistics with management and send them to you.” ${STD('Official deal statistics — to be confirmed')}</p>
<p><b>The client found a negative review online.</b> Do not argue or make excuses. Thank them, say you will pass it on to management, and offer confirmation with facts (documents, contacts of satisfied clients — with their consent).</p>
<h4>Typical newcomer mistakes</h4>
<ul><li>Talking about the company’s history for 5 minutes instead of asking about the client.</li><li>Rounding facts up: “we’ve been working for 15 years”, “hundreds of hotels”.</li><li>Confusing DI Phuket Property with Andaman Group.</li></ul>`;

 ['A proposal had no date for the prices; a week later the price went up.','A conflict with the client.','State “prices valid as of [date]”.','It protects both the client and the broker.'],
 ['All three properties in the proposal have different criteria.','A comparison is impossible.','The same criteria in a table.','The client should see the difference in a minute.']],
'4.7':[
 ['“I need to talk to my husband.”','The broker: “OK, we’ll wait.”','Offer to show the options to both of them at a convenient time.','We involve the decision-maker in the process.'],
 ['“You get a commission, so it’s in your interest to sell.”','The broker takes offence.','Acknowledge it: yes, there is a commission; explain that the company works for the long term and values recommendations.','Honesty disarms distrust.']],
'4.8':[
 ['The internet dropped during a Zoom call.','The broker disappears without a message.','Write to the client right away and offer to continue in 5 minutes or at another time.','A glitch is not a problem; disappearing is.'],
 ['During a viewing the client didn’t like the road noise.','The broker persuades: “You’ll get used to it.”','Acknowledge the downside, note it in the comparison, offer an alternative.','Honesty about the downsides makes the upsides more credible.']],
'4.9':[
 ['The developer changes the payment schedule after the reservation.','The broker simply forwards it to the client.','Inform the manager and the lawyer, explain the options to the client.','A change of terms is a reason for a check.'],
 ['A client missed a scheduled payment.','The broker waits.','Send a reminder in advance and check the consequences of late payment under the contract with the lawyer.','Late payment may cost the client a penalty.']],
'4.10':[
 ['Six months later a client is unhappy with the rental income.','The broker: “That’s a question for the management company.”','Arrange a meeting with management, analyse the causes, suggest solutions.','The client is the company’s client, not one department’s.'],
 ['A happy client offers to recommend friends.','The broker says thanks and forgets.','Ask for a contact or forward an introduction message, record it in the CRM as a recommendation.','A recommendation is the warmest lead.']],
'5.1':[
 ['A client calls a colleague while the broker is on holiday; the CRM is empty.','The colleague doesn’t know what was promised.','A note after every contact.','The “2-minute” test.'],
 ['The broker created a second “Ivan” in the CRM.','Duplicates; two people write to the client.','Search by phone first.','One client — one record.']],
'5.2':[
 ['A client received a selection with a sold property.','The broker didn’t check availability.','Check on the day of sending and note it in the CRM.','A mistake in availability undermines trust in the whole selection.'],
 ['The broker takes property photos from someone else’s listing.','A rights violation and inaccuracy.','Only company or developer materials.','Other people’s materials are a legal and reputational risk.']],
'5.3':[
 ['A client sent an important agreement as a voice message.','The broker didn’t record it.','Confirm it in text and record it in the CRM.','A voice message is hard to find and check.'],
 ['The broker messages a client at 2 am the client’s time.','Ignored the time zone.','Use scheduled sending or the client’s working hours.','Respect for the client’s personal time.']],
'5.4':[
 ['A client received a proposal as an editable file and changed the figures.','A dispute about the price.','Send clients only PDFs.','Protection against distortion.'],
 ['The broker corrected the contract text “at the client’s request”.','An edit without the lawyer.','All contract edits only through the lawyer.','A mistake in a contract can cost the deal.']],
'5.6':[
 ['The broker logged in to the CRM from a laptop in a café and left it open.','A risk of access by strangers.','Lock the screen and sign out of systems.','A data leak is an incident for the company.'],
 ['The broker pasted a conversation with passport data into a public AI service.','A breach of confidentiality.','Remove personal data or use permitted tools; inform the manager.','Personal data does not go to public services.']],
'6.1':[
 ['The broker starts with the most “interesting” client (premium, cold).','Ignores the hot ones.','Prioritise using the scale: hot clients with a clear request first.','Hot clients cool down faster.'],
 ['CL-05 wants a villa, and the broker immediately promises “we’ll register it in your name”.','No legal structure.','Explain the land restrictions and bring in the lawyer before the selection.','Otherwise the client will be disappointed at the contract stage.']],
'6.2':[
 ['The communication plan is “call once a week”.','The contacts bring no value.','Every contact with value and a date (a video, a calculation, news).','A contact without value feels like pressure.'],
 ['The proposal for CL-02 ignores seasonality.','Only an optimistic calculation.','Cautious and base scenarios.','A mandatory rule for calculations.']],
'6.3':[
 ['During practice the broker gets a client with a $2 million budget.','Handles them alone without the mentor.','Bring in the mentor/manager according to the onboarding rules.','Large deals during onboarding are handled with support.'],
 ['During practice a client is ready to reserve.','The broker promises terms without approval.','Agree the terms with the manager before replying.','A newcomer’s authority is limited.']],
'6.4':[
 ['In the exam the broker forgot the next step.','Loses 10 points.','End every consultation with an agreement and a date.','It is a skill, not a formality.'],
 ['The broker said “a stable 8% income”.','A critical mistake.','“In the base scenario the calculation gives about …% net; this is not a guarantee.”','A yield promise means the consultation is not passed.']],
'6.5':[
 ['The broker received “Cleared with supervision” and is upset.','Sees it as a failure.','Discuss the specific areas for growth and the date of the reassessment.','It is a working stage, not a judgement of the person.'],
 ['The manager is busy and keeps postponing the assessment.','The broker starts working without clearance.','Work within the practice rules until the decision.','Clearance is a mandatory condition for independent work.']]
};
[B1, B2, B3, B4, B5, B6].forEach(arr => arr.forEach(t => {

}));

// ================= AI-ПОМОЩНИК =================
// В claude.ai работает через возможность sample (AI отвечает по материалам платформы).
// Вне claude.ai — режим поиска: находит ответ в материалах и даёт ссылки.
const Agent = (() => {
  let AI = null, ready = false, busy = false, abort = null;
  let hist = []; // {role, content}
  const A = {ctx: ''};
  const hasWord = (txt, w) => new RegExp('(^|[^а-яёa-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(txt);
  A.hasWord = hasWord;
  // --- индекс знаний ---
  const strip = (h) => String(h || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').replace(/ ([.,;:!?»”)])/g, '$1').replace(/([«“(]) /g, '$1').trim();
  let IDX = [];
  function add(title, html, href, src) {
    const parts = String(html || '').split(/<h[34]>/i);
    parts.forEach((p, i) => { const m = p.match(/^(.*?)<\/h[34]>/i), sub = i && m ? strip(m[1]) : '';
      const text = strip(i && m ? p.slice(m[0].length) : p); if (text.length > 30) IDX.push({title: sub ? title + ' — ' + sub : title, text, href, src}); });
  }
  function build() {
    if (IDX.length) return;
    ALL.forEach(tp => { add(t('Тема {0}. ', tp.id) + tp.title, '<h3>' + t('Цель') + '</h3>' + tp.goal + ' ' + tp.why + tp.material + '<h3>' + t('Пример') + '</h3>' + tp.example, '#topic/' + tp.id, t('Тема {0}', tp.id)); });
    Object.entries(KB_LIB).forEach(([id, d]) => add(d.title, d.html || (d.ref && KB_DOCS[d.ref] && KB_DOCS[d.ref].html), '#doc/' + id, t('База знаний')));
    ['d_faq', 'd_help', 'd_guide'].forEach(id => KB_DOCS[id] && add(KB_DOCS[id].title, KB_DOCS[id].html, '#doc/' + id, t('База знаний')));
    DISTRICTS.forEach(d => IDX.push({title: t('Район {0}', d.n), text: [d.z, d.life, d.type, d.buyer, d.plus, d.minus, t('Цена земли: {0}', d.land), t('Подходит: {0}', d.fit)].join('. '), href: '#topic/3.2', src: t('Тема {0}', '3.2')}));
  }
  const STOP = ['как','что','для','это','при','или','где','чем','про','мне','если','какой','какая','какие','можно','нужно','есть','the','and','for','how','what','can','with','are','you','does','is','do','about','which','why','this','that'];
  const stem = (w) => w.length > 5 ? w.slice(0, w.length > 7 ? 6 : 5) : w;
  const words = (q) => q.toLowerCase().replace(/[^a-zа-яё0-9%\s]/gi, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP.includes(w)).map(stem);
  function search(q, n = 5) {
    build(); const ws = words(q); if (!ws.length) return [];
    return IDX.map(e => { const tx = (e.title + ' ' + e.text).toLowerCase(), tt = e.title.toLowerCase();
      let sc = 0; ws.forEach(w => { const c = tx.split(w).length - 1; if (c) sc += 1 + Math.min(c, 4) * .3 + (tt.includes(w) ? 1.5 : 0); }); return {e, sc}; })
      .filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, n).map(x => x.e);
  }
  // --- простая разметка ответа ---
  A.md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^#{1,3} (.+)$/gm, '<b>$1</b>').replace(/^[-•] (.+)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g, (m) => '<ul>' + m.replace(/\n/g, '') + '</ul>').replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  const modeText = () => !ready ? t('Подключение…') : AI ? t('AI отвечает по материалам платформы') : t('Поиск по материалам платформы');
  // --- подключение AI ---
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') AI = await window.claude.use('sample'); } catch (e) { AI = null; }
    ready = true; const m = document.querySelector('#ag-mode'); if (m) m.textContent = modeText();
  })();
  const RULES = () => LANG === 'en' ? `You are the AI assistant of the training platform for brokers of the DI Phuket Property real estate agency (Phuket, Thailand). You help a new broker understand the materials.
Rules:
- Answer in English, briefly and to the point (up to 150 words), in plain language; lists are fine.

function searchAll(q) {
  const ql = q.toLowerCase().trim(); if (ql.length < 2) return [];
  const idx = Agent.index(), out = [], seen = new Set();
  ALL.filter(tp => (tp.id + ' ' + tp.title).toLowerCase().includes(ql)).forEach(tp => out.push({title: t('Тема {0}. ', tp.id) + tp.title, text: tp.goal, href: '#topic/' + tp.id, src: t('Блок {0}', tp.bid.slice(1)), sc: 30}));
  Object.entries(KB_LIB).filter(([, d]) => (d.title + ' ' + d.desc).toLowerCase().includes(ql)).forEach(([id, d]) => out.push({title: d.title, text: d.desc, href: '#doc/' + id, src: t('База знаний · {0}', d.cat), sc: 20}));
  idx.forEach(e => { const ti = e.title.toLowerCase().indexOf(ql), x = e.text.toLowerCase(), i = x.indexOf(ql);
    if (ti < 0 && i < 0) return; out.push({title: e.title, text: e.text, pos: i, href: e.href, src: e.src, sc: (ti >= 0 ? 8 : 0) + Math.min(x.split(ql).length - 1, 5)}); });
  let res = out.sort((a, b) => b.sc - a.sc).filter(r => { const k = r.href + '|' + r.title; if (seen.has(k)) return false; seen.add(k); return true; });
  if (!res.length) res = Agent.search(q, 6).map(e => ({title: e.title, text: e.text, href: e.href, src: e.src, fuzzy: true}));
  return res.slice(0, 8);
}
function snip(r, q) {
  const ql = q.toLowerCase(); let tx = r.text || '', i = r.pos != null && r.pos >= 0 ? r.pos : tx.toLowerCase().indexOf(ql);
  const a = Math.max(0, i - 50); let s = (a ? '…' : '') + tx.slice(a, a + 150) + (tx.length > a + 150 ? '…' : '');
  s = esc(s); if (i >= 0) s = s.replace(new RegExp(esc(q.trim()).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
  return s;
}
function bindSearch() {
  const inp = $('#gs'), box = $('#gs-res'); let sel = -1, cur = [];
  const draw = () => { const q = inp.value; cur = searchAll(q); sel = -1;
    if (q.trim().length < 2) { box.hidden = true; return; }
    box.innerHTML = cur.length ? (cur[0].fuzzy ? '<div class="gs-note">' + t('Точных совпадений нет. Похожие материалы:') + '</div>' : '') + cur.map((r, i) => `<a class="gs-it" href="${r.href}" data-i="${i}"><span class="gs-src">${esc(r.src)}</span><b>${esc(r.title)}</b><span class="gs-sn">${snip(r, q)}</span></a>`).join('')
      : `<div class="gs-note">${t('По запросу «{0}» ничего не нашлось. Попробуйте другое слово или', esc(q))} <button class="linkbtn" id="gs-ai">${t('спросите AI-помощника')}</button>.</div>`;
    box.hidden = false; const ai = $('#gs-ai'); if (ai) ai.onclick = () => { box.hidden = true; Agent.open(q); };
    box.querySelectorAll('.gs-it').forEach(a => a.onclick = (e) => { e.preventDefault(); box.hidden = true; inp.value = ''; $('#top').classList.remove('searching'); go(a.getAttribute('href')); }); };
  inp.oninput = draw; inp.onfocus = () => { if (inp.value.trim().length >= 2) draw(); };
  inp.onkeydown = (e) => { const its = box.querySelectorAll('.gs-it');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!its.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length; its.forEach((x, i) => x.classList.toggle('on', i === sel)); its[sel].scrollIntoView({block: 'nearest'}); }
    if (e.key === 'Enter') { const x = its[sel >= 0 ? sel : 0]; if (x) x.click(); }
    if (e.key === 'Escape') { box.hidden = true; inp.blur(); $('#top').classList.remove('searching'); } };
}

// ---------- графики и дашборд ----------

}
const doneMark = (ok) => `<span class="dot ${ok ? 'ok' : ''}" title="${ok ? t('Выполнено') : t('Ещё не выполнено')}">${ok ? '✓' : ''}</span>`;
function stats() {

}
const fmtMin = (m) => m >= 60 ? t('{0} ч', Math.floor(m / 60)) + (m % 60 ? ' ' + t('{0} мин', m % 60) : '') : t('{0} мин', m);
const BLOCK_LAST_DAY = {b1: 1, b2: 2, b3: 4, b4: 7, b5: 8, b6: 10};
function planPct(day) { let a = 0, n = 0; BLOCKS.forEach(b => { const u = units(b.id).length; n += u; if (BLOCK_LAST_DAY[b.id] <= day) a += u; }); return Math.round(a / n * 100); }
const planNow = (day) => day ? Math.round((planPct(day - 1) + planPct(day)) / 2) : 0;
function paceChart() {

const STEP_NAMES = () => [t('Объяснение'), t('Пример'), t('Закрепление'), t('Проверка'), t('Задание'), t('Завершение')];

     ${crit.map(([ok, txt, st]) => `<div class="crit-row">${doneMark(ok)}<span class="tt">${txt}</span>${ok ? '' : `<a href="#topic/${id}/${st}">${t('Перейти →')}</a>`}</div>`).join('')}

const CRM_FIELDS = () => [['name', t('Имя клиента')], ['contact', t('Канал связи')], ['source', t('Источник')], ['goal', t('Цель покупки')], ['budget', t('Бюджет')], ['term', t('Срок решения')], ['area', t('Районы')], ['type', t('Тип объекта')]];

// ---------- механика тестов ----------
function quiz(el, Q, prev, pass, onResult, onDone) {
  let answers = Q.map(() => []), checked = false;
  const isRight = (q, a) => a.length === q.a.length && a.every(x => q.a.includes(x));
  const score = () => Math.round(Q.filter((q, i) => isRight(q, answers[i])).length / Q.length * 100);
  function draw() {
    el.innerHTML = (prev && !checked ? `<div class="score ${prev.best >= pass ? 'pass' : 'fail'}"><span class="v">${prev.best}%</span><span>${t('Лучший результат · Попыток: {0}', prev.attempts)}${prev.best >= pass ? ' · ' + t('Зачтено') : ''}</span></div>` : '') +
      Q.map((q, i) => `<div class="q"><div class="qt">${i + 1}. ${esc(q.q)}<small>${q.multi ? t('Несколько правильных ответов (квадратики)') : t('Один правильный ответ (кружки)')}</small></div>
      ${q.o.map((o, j) => { const sel = answers[i].includes(j), right = q.a.includes(j), cls = checked ? (right ? 'right' : sel ? 'wrong' : '') : '';
        return `<label class="opt ${cls}"><input type="${q.multi ? 'checkbox' : 'radio'}" name="q${i}" data-q="${i}" data-o="${j}" ${sel ? 'checked' : ''} ${checked ? 'disabled' : ''}><span>${esc(o)}</span></label>`; }).join('')}
      ${checked ? `<div class="expl"><b>${isRight(q, answers[i]) ? t('Верно.') : t('Неверно.')}</b> ${esc(q.e)}</div>` : ''}</div>`).join('') +
      (checked ? resultBox() : `<div class="navbtns"><span class="muted" id="qmsg"></span><button class="btn" id="qcheck">${t('Проверить ответы')}</button></div>`);
    el.querySelectorAll('input[data-q]').forEach(inp => inp.onchange = () => {
      const i = +inp.dataset.q, j = +inp.dataset.o;
      answers[i] = Q[i].multi ? (inp.checked ? [...answers[i], j] : answers[i].filter(x => x !== j)) : [j];
      const m = el.querySelector('#qmsg'); if (m) m.textContent = t('Отвечено: {0} из {1}', answers.filter(a => a.length).length, Q.length);
    });
    const c = el.querySelector('#qcheck');
    if (c) c.onclick = () => {
      const miss = answers.findIndex(a => !a.length);
      if (miss >= 0) { el.querySelector('#qmsg').textContent = t('Ответьте на все вопросы: пропущен вопрос {0}.', miss + 1); el.querySelectorAll('.q')[miss].scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
      checked = true; const p = score();
      const res = {attempts: ((prev && prev.attempts) || 0) + 1, best: Math.max(p, (prev && prev.best) || 0), lastPct: p};
      onResult(res); prev = res; draw(); el.querySelector('.score').scrollIntoView({behavior: 'smooth', block: 'center'});
    };
    const r = el.querySelector('#qretry'); if (r) r.onclick = () => { answers = Q.map(() => []); checked = false; draw(); el.scrollIntoView({behavior: 'smooth', block: 'start'}); };
    const d = el.querySelector('#qdone'); if (d) d.onclick = onDone;
  }
  function resultBox() {
    const p = score(), ok = p >= pass;
    return `<div class="score ${ok ? 'pass' : 'fail'}"><span class="v">${p}%</span><span><b>${ok ? t('Зачтено') : t('Не зачтено')}</b> · ${t('Проходной балл — {0}%.', pass)} ${ok ? '' : t('Изучите объяснения и попробуйте снова.')}</span></div>
    <div class="navbtns"><button class="btn ghost" id="qretry">${t('Пройти заново')}</button>${ok ? `<button class="btn" id="qdone">${t('Продолжить →')}</button>` : ''}</div>`;
  }
  draw();
}

  }
  function key2(e) { if (!ov) return; if (e.key === 'Escape') end(); if (e.key === 'ArrowRight') nav(1); if (e.key === 'ArrowLeft') nav(-1); }

    if (!r || !r.width) { spot.style.cssText = `left:${vw / 2}px;top:${vh / 2}px;width:0;height:0`; tip.className = 'tour-tip center'; tip.style.cssText = ''; return; }

})();

  el.querySelectorAll('input').forEach(i => i.oninput = calc); calc();
 },
 districts(el) {

 tz(el) {

  el.innerHTML = `<div class="calc"><div class="grid g2"><div><label class="f" for="tz-c">${t('Город клиента')}</label><select id="tz-c">${Z.map(([n, o], i) => `<option value="${i}">${n} (UTC${o >= 0 ? '+' : ''}${o})</option>`).join('')}</select></div><div><label class="f" for="tz-t">${t('Время у клиента')}</label><input type="text" id="tz-t" value="18:00" inputmode="numeric"></div></div><div class="calcout" id="tz-o" style="grid-template-columns:1fr 1fr"></div></div>
  <p class="muted" style="font-size:13px">${t('Пхукет — UTC+7, летнее время там не вводится. Для городов с летним временем выберите нужный период.')}</p>`;
  const calc = () => { const mm = el.querySelector('#tz-t').value.match(/(\d{1,2})(?:[:.](\d{2}))?/), o = Z[+el.querySelector('#tz-c').value][1];
   const out = el.querySelector('#tz-o'); if (!mm || +mm[1] > 23) { out.innerHTML = `<div><span>${t('Время на Пхукете')}</span><b>—</b></div><div><span>${t('Разница')}</span><b>${7 - o >= 0 ? '+' : ''}${t('{0} ч', 7 - o)}</b></div>`; return; }
   const h = +mm[1], m = +(mm[2] || 0), ph = (h + 7 - o + 48) % 24;
   out.innerHTML = `<div><span>${t('Время на Пхукете')}</span><b>${String(ph).padStart(2, '0')}:${String(m).padStart(2, '0')}</b></div><div><span>${t('Разница')}</span><b>${7 - o >= 0 ? '+' : ''}${t('{0} ч', 7 - o)}</b></div>`; };

// ================= ВХОД ПО ЛОГИНУ И ПАРОЛЮ (демо) =================
// Демонстрационный экран входа: проверка идёт в браузере, поэтому это не защита данных.
// Учётные записи: логин, SHA-256 пароля, имя. Добавить брокера — новая строка в ACCOUNTS.
const ACCOUNTS = [
  {login: 'broker', hash: '2b055e06d08369b8e37b5165133a738804978d9ff120fc2191739babba600c78', name: ''},   // пароль: phuket2026
  {login: 'mentor', hash: '5e96e65ed2472ae2cb065e232bc6d155e02c6fbaa41025d06c38bbfb11a06954', name: ''}    // пароль: mentor2026
];
const Auth = (() => {
  const SKEY = 'dipp_session';
  let cur = null;
  function sha256(str) { // компактная реализация SHA-256, работает и без crypto.subtle
    const K = [], H = []; let n = 2, c = 0;
    const isP = (x) => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
    const frac = (x) => (x - Math.floor(x)) * 4294967296 | 0;
    while (c < 64) { if (isP(n)) { if (c < 8) H[c] = frac(Math.pow(n, 1 / 2)); K[c++] = frac(Math.pow(n, 1 / 3)); } n++; }
    const bytes = Array.from(new TextEncoder().encode(str)), bl = bytes.length * 8;
    bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bl >>> (i * 8)) & 255);
    const rr = (x, k) => (x >>> k) | (x << (32 - k)), w = new Array(64);
    for (let o = 0; o < bytes.length; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = bytes[o + i * 4] << 24 | bytes[o + i * 4 + 1] << 16 | bytes[o + i * 4 + 2] << 8 | bytes[o + i * 4 + 3];
      for (let i = 16; i < 64; i++) { const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      let [a, b, cc, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) { const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0; h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0; }
      [a, b, cc, d, e, f, g, h].forEach((x, i) => H[i] = (H[i] + x) | 0);
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
  }
  const find = (l) => ACCOUNTS.find(a => a.login === String(l || '').trim().toLowerCase());
  function enter(acc) {
    cur = acc.login; KEY = BASE_KEY + ':' + acc.login;
    try { if (!localStorage.getItem(KEY) && acc.login === ACCOUNTS[0].login && localStorage.getItem(BASE_KEY)) localStorage.setItem(KEY, localStorage.getItem(BASE_KEY)); } catch (e) {}
    loadState(); if (acc.name && S.profile.name === DEFAULT_NAME) S.profile.name = acc.name;
    try { localStorage.setItem(SKEY, acc.login); } catch (e) {}
    lastHash = null; route();
  }
  function screen(msg) {
    cur = null; Agent.reset(); document.body.classList.add('auth-on');
    document.getElementById('app').innerHTML = `<div class="login"><button class="ibtn langbtn login-lang" id="li-lang" aria-label="${t('Сменить язык')}">${LANG === 'ru' ? 'EN' : 'RU'}</button>
     <form class="login-card" id="li-form" novalidate>
      <div class="brand login-brand"><div class="logo">DI</div><div><div class="t">${t('Академия брокера')}</div><div class="k">DI Phuket Property</div></div></div>
      <h1>${t('Вход в систему обучения')}</h1><p class="muted">${t('Введите логин и пароль, которые вы получили в приветственном письме.')}</p>
      <label class="f" for="li-login">${t('Логин')}</label><input type="text" id="li-login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="f" for="li-pass">${t('Пароль')}</label><div class="pw"><input type="password" id="li-pass" autocomplete="current-password" required><button type="button" class="pw-eye" id="li-eye" aria-label="${t('Показать пароль')}">${svg('eye')}</button></div>
      <div class="flag" id="li-err" role="alert" ${msg ? '' : 'hidden'}>${msg || ''}</div>
      <button class="btn login-btn" type="submit">${t('Войти')}</button>
      <p class="login-help">${t('Забыли пароль? Напишите руководителю отдела продаж.')}</p>
      <div class="login-demo">${t('Демо-доступ')}: <b>broker</b> / <b>phuket2026</b></div>
     </form></div>`;
    const err = (m) => { const e = $('#li-err'); e.textContent = m; e.hidden = false; };
    $('#li-lang').onclick = () => { LANG = LANG === 'ru' ? 'en' : 'ru'; try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {} loadData(); screen(); };
    $('#li-eye').onclick = () => { const i = $('#li-pass'); i.type = i.type === 'password' ? 'text' : 'password'; $('#li-eye').classList.toggle('on', i.type === 'text'); };
    $('#li-form').onsubmit = (e) => { e.preventDefault();
      const l = $('#li-login').value, pw = $('#li-pass').value;
      if (!l.trim() || !pw) return err(t('Введите логин и пароль.'));
      const acc = find(l);
      if (!acc || sha256(pw) !== acc.hash) { $('#li-pass').value = ''; $('#li-pass').focus(); return err(t('Неверный логин или пароль. Проверьте раскладку клавиатуры и попробуйте ещё раз.')); }
      document.body.classList.remove('auth-on'); enter(acc); };
    setTimeout(() => { const i = $('#li-login'); if (i) i.focus(); }, 50);
  }
  return {
    user: () => cur,
    start() { let l = null; try { l = localStorage.getItem(SKEY); } catch (e) {} const acc = find(l); if (acc) enter(acc); else screen(); },
    logout() { try { localStorage.removeItem(SKEY); } catch (e) {} const ov = document.querySelector('.tour'); if (ov) ov.remove(); drawer(false); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} screen(); }
  };
})();

Auth.start();
