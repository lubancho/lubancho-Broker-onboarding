{
 id:'1.2', title:'The founder and management', min:15,
 goal:'Know the company founder, her experience and role, and the managers the broker works with.',
 why:'The founder’s experience is a strong argument for an investor: a company led by someone who has built a hotel understands properties from the inside. But it must be stated accurately, without exaggeration.',
 material:`
<h3>Diana Fedorova, founder</h3>
<p>According to the company website, <b>Diana Fedorova</b> is the founder of <b>DI Phuket Property</b> and <b>Andaman Group</b>.</p>
<ul>
<li>Started her own business at 25.</li>
<li>Built the <b>Andaman Riviera by Radisson</b> hotel.</li>
<li>Speaks at international investment forums.</li>
<li>Member of the <b>Thai-Russian Chamber of Commerce (TRCC)</b>.</li></ul>
<h3>What this means for the client</h3>
<p>The founder has gone through the developer’s path herself — from a plot of land to an operating hotel under an international brand. That is why the company focuses not on “selling square metres” but on investment logic: yield, risks, clean title and construction quality.</p>
<h3>Personal consultation with the founder</h3>
<p>The company offers a personal consultation with Diana Fedorova: <b>1–3 hours, $1,000</b> (according to the website). When it makes sense to offer it:</p>
<ul><li>buying a hotel, land or a large package of units;</li><li>the client needs an investment strategy rather than a choice of one apartment;</li><li>the client explicitly asks to meet management.</li></ul>
<p><span class="tbc">Booking procedure and approval with the manager — to be confirmed</span>.</p>
<h3>Department heads</h3>
<table class="tbl"><tr><th>Role</th><th>Who</th><th>Why the broker needs them</th></tr>
<tr><td>Head of Sales</td><td><span class="tbc">name to be confirmed</span></td><td>Your manager: tasks, clearance, disputed issues</td></tr>
<tr><td>Lawyer / legal partner</td><td><span class="tbc">to be confirmed</span></td><td>Property checks, contracts, ownership questions</td></tr>
<tr><td>Property management</td><td><span class="tbc">to be confirmed</span></td><td>Rental and maintenance after the purchase</td></tr>
<tr><td>Mentor</td><td><span class="tbc">assigned on your first day</span></td><td>Reviews tasks and answers questions during onboarding</td></tr></table>`,
 example:`
<p><b>Client:</b> “Who is behind the company?”</p>
<p><b>Broker:</b> “The founder is Diana Fedorova. She is a developer herself: she built the Andaman Riviera by Radisson hotel in Phuket and is a member of the Thai-Russian Chamber of Commerce. That is why we look at properties as investors: what will happen to the yield, who the developer is, whether the documents are clean. If you are considering a large purchase, such as a hotel or land, you can meet Diana separately.”</p>
<p class="muted">A mistake to avoid: “Diana personally checks every property.” No source says so.</p>`,
 checklist:['I know the founder’s name and role','I can name the hotel she built','I know what TRCC is','I know the terms of the personal consultation and when to offer it','I know who my manager and mentor are'],
 quiz:[
  {q:'Which hotel did the company founder build (according to the website)?', o:['Laguna Beachside','Andaman Riviera by Radisson','Angsana Beachfront','Arista Hotel'], a:[1], e:'Laguna Beachside and Angsana Beachfront are managed properties; Arista Hotel is a sold property.'},
  {q:'Who should be offered a personal consultation with the founder? Select all correct answers.', multi:true, o:['A buyer of a hotel or land','A client who needs an investment strategy','Every client on the first call','A client who asks to meet management'], a:[0,1,3], e:'The consultation is paid ($1,000) and intended for large and strategic requests.'},
  {q:'Which statement about management is acceptable in a conversation with a client?', o:['“Diana personally guarantees the yield”','“The founder built a hotel under the Radisson brand”','“We are the largest company on the island”','“Diana checks every deal”'], a:[1], e:'Only confirmed facts. The other phrases are unverified promises.'}
 ],
 criteria:['Mini-check passed','The broker knows whom to ask questions during onboarding'],
 links:[['Home page: about the founder',SITE],['Deal support: consultation with the founder',SITE+'soprovozhdenie-sdelok']]
},
{
 id:'1.3', title:'Mission, values and strategy', min:15,
 goal:'Understand what the company promises clients and which principles are mandatory when working with investors.',
 why:'The company’s principles are the frame within which a broker makes decisions: what can and cannot be promised to a client, and what to do in a disputed situation.',
 material:`
<h3>The company’s public position</h3>
<blockquote>“We don’t just sell real estate — we develop investment strategies.”</blockquote>
<p>On its website the company highlights three priorities: <b>yield</b>, <b>capital protection</b> and <b>transparency</b>. Another phrase from the website: “we work with every client for the long term”.</p>
<h3>What this means in practice</h3>
<table class="tbl"><tr><th>Priority</th><th>What the broker does</th></tr>
<tr><td>Yield</td><td>Matches the property to the client’s goal and shows the calculation: income, costs, scenarios</td></tr>
<tr><td>Capital protection</td><td>Talks about risks, recommends a legal check, does not rush the decision</td></tr>
<tr><td>Transparency</td><td>Discloses all costs and terms, confirms agreements in writing</td></tr>
<tr><td>Long-term work</td><td>Supports the client after the deal too: management, rental, resale</td></tr></table>
<h3>Mission and values</h3>
<p><span class="tbc">The official mission and list of values are not published — the text will be provided by management.</span></p>
<h3>Strategy for 3–5 years</h3>
<p><span class="tbc">Strategic goals are not publicly confirmed.</span> The broker does not tell clients about the company’s plans until they are approved.</p>
<h3>Mandatory principles for working with investors</h3>
<ol><li><b>Never guarantee yield.</b> Any yield is a calculation or a forecast, not a promise.</li>
<li><b>Disclose all costs:</b> taxes, fees, maintenance, management, commissions.</li>
<li><b>Recommend a legal check</b> of the property and the developer before payment.</li>
<li><b>Confirm agreements in writing</b> — in messages and in the CRM.</li>
<li><b>Do not pressure the client</b> with artificial urgency.</li></ol>
<p class="muted">Points 1–5 are the standard for responsible sales of investment property. <span class="tbc">To be approved as mandatory company rules.</span></p>`,
 example:`
<p><b>Client:</b> “I was told you can earn 50% a year in Phuket. Do you guarantee that?”</p>
<p><b>Broker:</b> “Nobody can guarantee yield — it depends on the property, occupancy, season and management. Let me show you the calculation for a specific property in three scenarios — cautious, base and optimistic — with all costs. That way you will see the real picture.”</p>`,
 checklist:['I know the positioning: “we develop investment strategies”','I can name the three priorities: yield, capital protection, transparency','I know the 5 mandatory principles for working with investors','I understand why yield must never be guaranteed'],
 quiz:[
  {q:'Which three priorities does the company highlight in its positioning?', o:['Speed, price, discounts','Yield, capital protection, transparency','Luxury, status, exclusivity','New builds, rentals, yachts'], a:[1], e:'This is the wording from the company website.'},
  {q:'A client asks you to guarantee 20% a year. What is right?', o:['Guarantee it if the property is good','Refuse and end the conversation','Explain that yield is a forecast and show the calculation in several scenarios','Promise a refund if income is lower'], a:[2], e:'Guaranteeing yield is a critical mistake. A scenario calculation is honest and useful for the client.'},
  {q:'What belongs to the mandatory principles for working with investors? Select all correct answers.', multi:true, o:['Disclose all costs','Recommend a legal check','Create urgency so the client decides faster','Confirm agreements in writing'], a:[0,1,3], e:'Artificial urgency contradicts the principle of working for the long term.'}
 ],
 criteria:['Mini-check passed','The broker names the 5 principles for working with investors'],
 links:[['Home page: positioning',SITE]]
},
{
 id:'1.4', title:'Organisational structure', min:15,
 goal:'Understand how work around the broker is organised and whom to contact about each question.',
 why:'The broker does not do everything alone: the lawyer handles legal checks, a separate team handles management. Knowing who is responsible for what saves the client’s time and protects against mistakes.',
 material:`
<h3>Interaction diagram</h3>
<div class="org">
 <div class="org-top"><div class="ob main">Founder<br><b>Diana Fedorova</b></div></div>
 <div class="org-mid"><div class="ob">Head of Sales<br><span class="tbc">Name</span></div></div>
 <div class="org-row">
  <div class="ob you">Broker<br><b>you</b></div>
  <div class="ob">Mentor<br><span class="tbc">Name</span></div>
 </div>
 <div class="org-label">Who the broker works with</div>
 <div class="org-row">
  <div class="ob soft">Lawyer<br><span class="tbc">Name</span></div>
  <div class="ob soft">Property search and catalogue<br><span class="tbc">Name</span></div>
  <div class="ob soft">Property management<br><span class="tbc">Name</span></div>
  <div class="ob soft">Marketing and leads<br><span class="tbc">Name</span></div>
 </div>
</div>
<p class="muted">The diagram is based on the business lines listed on the company website. <span class="tbc">Actual structure, names and contacts — to be confirmed.</span></p>
<h3>Whom to contact</h3>
<table class="tbl"><tr><th>Question</th><th>Whom to contact</th></tr>
<tr><td>Tasks, priorities, a discount beyond your authority, a disputed situation</td><td>Head of Sales</td></tr>
<tr><td>How to do a task, where to find material</td><td>Mentor</td></tr>
<tr><td>Ownership, freehold/leasehold, contract, developer check</td><td>Lawyer</td></tr>
<tr><td>Current price and availability of a property</td><td>Search and catalogue</td></tr>
<tr><td>Rental and management after the purchase</td><td>Property management</td></tr>
<tr><td>Where a lead came from, advertising materials</td><td>Marketing</td></tr>
<tr><td>Large deal: hotel, land, package of units</td><td>Head of Sales → founder</td></tr></table>
<h3>The main rule</h3>
<p>If a question concerns <b>law, money or promises to the client</b> and you are not sure of the answer, do not guess. Tell the client: “I will check with our lawyer and get back to you today by 6 pm” — and do it.</p>`,
 example:`
<p><b>Situation:</b> a client asks whether a foreigner can register a villa with land in their own name.</p>
<p><b>Wrong:</b> “Yes, no problem, everyone does it.”</p>
<p><b>Right:</b> “Foreigners face restrictions on land ownership, and there are several ways to structure it. To give you an exact answer for your case, I will bring in our lawyer — you will have their comment today.”</p>`,
 checklist:['I know my manager and mentor','I know who handles legal questions','I know whom to ask for a property’s current price','I know the rule: law, money and promises — only after checking'],
 quiz:[
  {q:'A client asks how a foreigner can register land in their name. What do you do?', o:['Answer myself as I understand it','Bring in the lawyer and tell the client when to expect an answer','Say it is impossible','Advise them to find a lawyer themselves'], a:[1], e:'Legal questions go through the lawyer, with a clear response time for the client.'},
  {q:'A client asks for a bigger discount than you can give. Whom do you contact?', o:['The lawyer','Marketing','The Head of Sales','Nobody — I refuse'], a:[2], e:'Decisions beyond your authority are made by the Head of Sales.'},
  {q:'A client wants to buy a hotel. Who joins the deal?', o:['Only the broker','The Head of Sales and, if needed, the founder','Only property management','Marketing'], a:[1], e:'The company handles large deals with management involved.'}
 ],
 criteria:['Mini-check passed','The broker routes questions correctly'],
 links:[]
},
{
 id:'1.5', title:'Geography and business lines', min:20,
 goal:'Know where the company operates, which properties and services it offers, and what falls within the broker’s responsibility.',
 why:'A client often starts with one request (“an apartment”), and the conversation reveals another (seasonal rental, management, land). A broker who knows all business lines does not lose the client.',
 material:`
<h3>Where the company operates</h3>
<ul><li><b>Phuket</b> — the main market.</li><li><b>Dubai</b> — the second market listed on the website.</li></ul>
<h3>Why Phuket</h3>
<p>Phuket is Thailand’s largest island, an international resort with its own international airport. Housing demand here comes from tourists, foreigners who live on the island permanently or seasonally, and investors who rent properties out.</p>
<div class="claim">According to the company, only about a third of the island is available for development; the rest is occupied by national parks. <span class="tbc">Source of the figure — to be clarified; do not use it as an argument until confirmed.</span></div>
<p>The market, areas and investment economics are covered in detail in <b>block 3</b>.</p>
<h3>Which properties the agency works with</h3>
<table class="tbl"><tr><th>Category</th><th>Example request</th></tr>
<tr><td>Apartments</td><td>To live in, rent out or resell</td></tr>
<tr><td>Villas</td><td>For a family, seasonal living or rental</td></tr>
<tr><td>Hotels</td><td>Buying an operating hotel or one under construction</td></tr>
<tr><td>Land</td><td>For building villas or a resort; a 5–30-year horizon</td></tr>
<tr><td>Bulk deals</td><td>Buying several units at a reduced price</td></tr></table>
<h3>Additional services (prices from the website — check before quoting them to a client)</h3>
<table class="tbl"><tr><th>Service</th><th>Price on the website</th></tr>
<tr><td>Apartments in a complex with a pool and security</td><td>from $2,500 per month</td></tr>
<tr><td>Villas with 2–5 bedrooms and a pool</td><td>from $300 per night</td></tr>
<tr><td>Yacht charter, 30–130 feet</td><td>from $800 per day</td></tr>
<tr><td>Helicopter tour</td><td>from $295 per person</td></tr>
<tr><td>Signature investment tour (one week)</td><td>from $800 per day</td></tr>
<tr><td>Property management</td><td><span class="tbc">terms to be confirmed</span></td></tr></table>
<h3>What is part of the broker’s job</h3>
<p><span class="tbc">The manager approves the broker’s area of responsibility (which properties and services they handle themselves and which they hand over to colleagues).</span> Until then the rule is: the broker handles the client personally and brings in the manager for hotels, land and bulk deals.</p>`,
 example:`
<p><b>Client:</b> “I need an apartment, but I’m in Phuket only three months a year.”</p>
<p><b>Broker:</b> “Then it matters that the apartment works while you are away. After the purchase we can take it into management: find tenants, look after its condition and send you income and expense reports. Let’s choose a property that rents well in the months when you are not on the island.”</p>`,
 checklist:['I know the two markets: Phuket and Dubai','I can list the property categories','I know the additional services and where to check prices','I understand when to bring in the manager'],
 quiz:[
  {q:'Which markets does the company work in (according to the website)?', o:['Phuket and Bali','Phuket and Dubai','Bangkok only','Phuket and Pattaya'], a:[1], e:'The website lists Phuket and Dubai.'},
  {q:'A client spends 3 months a year on the island. Which service should be offered along with the purchase?', o:['A helicopter tour','Property management and rental','Yacht charter','Nothing, just the property'], a:[1], e:'Management lets the property earn income while the owner is away.'},
  {q:'Can you quote a yacht charter price of “$800 per day” without checking?', o:['Yes, it is on the website','No, the price must be checked before quoting it','Yes, prices never change','No, there is no such service'], a:[1], e:'Website prices are “from” guidelines; check that they are current before the conversation.'}
 ],
 criteria:['Mini-check passed','The broker spots additional sales in the client’s request'],
 links:[['Additional services',SITE+'dopolnitelnye-uslugi'],['Property management',SITE+'upravlenie-nedvizhimostyu']]
},
{
 id:'1.6', title:'Positioning and competitive advantages', min:25,
 goal:'Be able to explain to a client how the company differs from other ways of buying, without unconfirmed promises.',
 why:'Clients compare: buying directly from the developer, through a small agent or through a full-cycle agency. The broker must show the value of support with facts.',
 material:`
<h3>Advantages the company states publicly</h3>
<ol><li><b>Full cycle:</b> selection → deal → management → rental and resale.</li>
<li><b>Investment approach:</b> “we develop investment strategies” rather than just selling square metres.</li>
<li><b>Legal and construction expertise:</b> the company claims “deep knowledge of legal realities” and construction specifics.</li>
<li><b>Experience since 2014</b> on the Phuket market.</li>
<li><b>The founder is a developer</b> who built a hotel under the Radisson brand.</li>
<li><b>Complex deals:</b> hotels, land, bulk purchases, resort complexes.</li></ol>
<h3>What a home buyer gets and what an investor gets</h3>
<table class="tbl"><tr><th>Buyer for living</th><th>Investor</th></tr>
<tr><td>Area and property chosen for their lifestyle</td><td>Yield calculation and scenarios</td></tr>
<tr><td>Check of documents and the developer</td><td>Strategy: rental, resale or both</td></tr>
<tr><td>Deal support in Russian</td><td>Property management after the purchase</td></tr>
<tr><td>Services for life on the island</td><td>Access to large and bulk deals</td></tr></table>
<h3>Comparing ways to buy</h3>
<table class="tbl"><tr><th>Option</th><th>Pros</th><th>Limitations</th></tr>
<tr><td>Directly from the developer</td><td>No intermediary, developer promotions</td><td>You see only one developer’s projects; the seller protects its own interests</td></tr>
<tr><td>Private agent</td><td>Flexibility, personal contact</td><td>Limited choice and resources: lawyer, management, large deals</td></tr>
<tr><td>Full-cycle agency</td><td>Comparison of different projects, legal support, management after the purchase</td><td>You need to choose an agency with proven experience</td></tr></table>
<h3>The argument formula</h3>
<p><b>Fact → what it gives the client → proof.</b></p>
<p>Example: “We have been working since 2014 (fact), so we have seen different market cycles and know which developers deliver on time (benefit). I can show you properties we have sold and now manage (proof).”</p>
<div class="claim"><b>Never use as a promise:</b> “yield of up to 50% a year”, “248% in 2.5 years”, “savings of up to 40%”. These are website claims without a published calculation. <span class="tbc">If the company confirms the cases with calculations, they can be shown as an example of a specific deal, not as an expected result.</span></div>`,
 example:`
<p><b>Client:</b> “Why not buy directly from the developer? Without your commission.”</p>
<p><b>Broker:</b> “You can buy directly. The difference is that the developer’s sales team shows only its own projects and represents the developer’s interests. We will compare several projects for you, check the documents and the developer, and after the purchase take the property into management. Let me show you 2–3 options within your budget, and you can compare for yourself.”</p>
<p class="muted">The broker does not criticise the developer or say “we are cheaper” — they show the difference in service.</p>`,
 checklist:['I can name 4–6 of the company’s advantages','I know the formula “fact → benefit → proof”','I can explain the difference between buying from a developer and through an agency','I know which website figures must not be used as a promise'],
 quiz:[
  {q:'Which argument follows the “fact → benefit → proof” formula?', o:['“We are the best on the island, everyone knows it”','“We have been working since 2014, we know which developers deliver on time — I can show properties we have sold”','“We have the lowest prices”','“Yield of up to 50% a year”'], a:[1], e:'Only the second option contains a verifiable fact, a benefit and proof.'},
  {q:'Client: “Why not buy directly from the developer?” Which answers are appropriate? Select all correct answers.', multi:true, o:['Explain that the agency compares several projects','Say that developers cheat','Mention the document check and management after the purchase','Offer to show options for comparison'], a:[0,2,3], e:'Criticising developers is an improper technique and a breach of standards.'},
  {q:'How should the website phrase “yield of up to 50% a year” be used?', o:['As a guarantee','As the market average','Not as a promise; show the calculation for a specific property','Only for VIP clients'], a:[2], e:'The figure is not backed by a calculation; promising yield is a critical mistake.'}
 ],
 practice:{title:'Three arguments for a client', task:'Write three arguments in favour of DI Phuket Property for an investor choosing between an agency and buying from a developer. Each argument follows the formula “fact → benefit → proof”.', criteria:['Each argument contains a verifiable fact','The benefit for the investor is clear','No yield promises and no criticism of competitors']},
 criteria:['Mini-check passed','The practical task is accepted by the mentor'],
 links:[['Company home page',SITE],['Deal support',SITE+'soprovozhdenie-sdelok']]
},
{
 id:'1.7', title:'Team and company life', min:10,
 goal:'Know how communication works inside the team: meetings, channels, training.',
 why:'A newcomer gets up to speed faster when they know where to ask questions, when the stand-ups are and how colleagues usually communicate.',
 material:`
<h3>Communication format</h3>
<table class="tbl"><tr><th>What</th><th>Where and when</th></tr>
<tr><td>Work questions to the team</td><td><span class="tbc">work chat — name and link to be confirmed</span></td></tr>
<tr><td>Sales team stand-up</td><td><span class="tbc">day, time, format</span></td></tr>
<tr><td>Deal reviews and training</td><td><span class="tbc">frequency</span></td></tr>
<tr><td>Meetings with the mentor during onboarding</td><td>Days 1, 5, 6, 7 and 10 — according to the training plan (Zoom)</td></tr></table>
<h3>Principles of teamwork</h3>
<ol><li><b>The client is a shared result.</b> If a colleague needs help with a property or a translation, we help.</li>
<li><b>Ask right away.</b> Better to ask on day one than to make a mistake with a client.</li>
<li><b>In writing and in one place.</b> Client agreements go into the CRM, not just personal messages.</li>
<li><b>Respect for time.</b> Put the whole question at once: client, property, what you need, by when.</li></ol>
<p class="muted">Principles 1–4 are the working standard for onboarding. <span class="tbc">The company adds its own traditions, events and response-time standards.</span></p>
<h3>How to ask a colleague a question</h3>
<p><b>Bad:</b> “Got a minute?”</p>
<p><b>Good:</b> “Client Ivan, request: a two-bedroom in Bang Tao up to $250k. I need the current price for project X by 3 pm — he has a call at 4 pm.”</p>`,
 example:`
<p>On day two a broker cannot find a property presentation. Instead of searching for an hour, he writes to the mentor: “I can’t find the current presentation of project X for a client, the call is at 2 pm. Where is it?” — and gets a link five minutes later.</p>`,
 checklist:['I know where to ask the team questions','I know the schedule of meetings with the mentor','I can phrase a question to a colleague completely'],
 quiz:[
  {q:'Which question to a colleague is phrased correctly?', o:['“Got a minute?”','“Help me with a client”','“Client Ivan, two-bedroom in Bang Tao up to $250k, I need the current price for project X by 3 pm”','“Where is everything?”'], a:[2], e:'A complete question: client, task, deadline.'},
  {q:'Where are client agreements recorded?', o:['Only in a personal messenger','In the CRM','In the broker’s memory','In a notebook'], a:[1], e:'Agreements must be available to the team and the manager — in the CRM.'},
  {q:'You do not understand a task on day one. What do you do?', o:['Wait for the mentor to ask','Ask the mentor right away','Skip the task','Do it as I understand and sort it out later'], a:[1], e:'Asking right away saves time for both you and the mentor.'}
 ],
 criteria:['Mini-check passed'],
 links:[]
},
{
 id:'1.8', title:'Standards of professional conduct', min:20,
 goal:'Know the rules of business communication, ethics, confidentiality and escalation.',
 why:'A breach of ethics or a client data leak can cost the company its reputation and the broker their job. These rules apply from day one, even before clearance to work with clients.',
 material:`
<h3>Business communication with clients</h3>
<ul><li>Use the formal form of address until the client suggests otherwise.</li>
<li>Reply quickly. <span class="tbc">Standard time for the first reply to an enquiry — to be confirmed</span>; if you cannot answer right away, say when you will.</li>
<li>Confirm every agreement in writing: “So, we agreed: …”.</li>
<li>Do not discuss the company’s internal affairs or colleagues with clients.</li></ul>
<h3>Ethical rules</h3>
<ol><li><b>We do not guarantee yield</b> or price growth.</li>
<li><b>We do not hide risks and costs.</b></li>
<li><b>We do not pressure</b> with urgency or a “last unit” if it is not true.</li>
<li><b>We do not criticise competitors</b> or developers — we compare on facts.</li>
<li><b>We do not promise what is beyond our authority:</b> discounts, deadlines, legal conclusions.</li></ol>
<h3>Confidentiality</h3>
<ul><li>Client data (passport, phone, budget, negotiation history) is stored only in the company’s work systems.</li>
<li>Do not forward client documents to personal chats or keep them on personal devices unless necessary.</li>
<li>Do not upload clients’ personal data to public AI services. <span class="tbc">Company rules for AI tools — to be confirmed.</span></li>
<li>Information about deals, prices and company terms is internal until the manager allows it to be disclosed.</li></ul>
<h3>When to escalate to the manager immediately</h3>
<table class="tbl"><tr><th>Situation</th><th>Action</th></tr>
<tr><td>A client complaint or claim</td><td>Listen, record it, pass it to the manager the same day</td></tr>
<tr><td>A legal question you are not sure about</td><td>Bring in the lawyer, do not draw conclusions yourself</td></tr>
<tr><td>A request for a discount or terms beyond your authority</td><td>Pause and agree it with the manager</td></tr>
<tr><td>Suspicious payments, a request to “bypass” the rules in a deal</td><td>Stop the discussion and inform the manager immediately</td></tr>
<tr><td>A leak or loss of access to client data</td><td>Inform the manager and the administrator immediately</td></tr></table>`,
 example:`
<p><b>Situation:</b> a client sends a photo of their passport to your personal Telegram.</p>
<p><b>Right:</b> thank them, upload the document to the client’s CRM record, delete it from the personal chat and suggest that from now on they send documents through the work channel.</p>`,

 goal:'Understand who an overseas property broker is, what value they create and where their responsibility ends.',
 why:'The client is buying an expensive asset abroad, often without seeing it in person. The broker is their main guide. Understanding your role protects you from “selling at any cost” and from trying to settle questions that belong to the lawyer or the manager.',
 material:`
<h3>Who an overseas property broker is</h3>
<p>A broker is a specialist who helps a client <b>make an informed decision about buying property abroad</b> and takes them through the whole journey, from the first enquiry to receiving the property. The broker knows the market, the properties and the deal process and can explain all of this to someone who is seeing Phuket for the first time.</p>
<h3>What value the broker creates for the client</h3>
<ul><li><b>Saves time:</b> instead of hundreds of listings the client gets 3–5 suitable options.</li>
<li><b>Reduces risk:</b> warns about pitfalls, brings in the lawyer, checks the developer.</li>
<li><b>Brings clarity to the numbers:</b> shows the full cost of buying and owning, and income in different scenarios.</li>
<li><b>Supports the client:</b> reservation, contract, payment, registration, handover to management.</li></ul>
<h3>Broker, realtor, consultant, investment adviser: the difference</h3>
<table class="tbl"><tr><th>Role</th><th>What they do</th><th>How a DI Phuket Property broker differs</th></tr>
<tr><td>Realtor (in the everyday sense)</td><td>Shows properties and handles the deal</td><td>The broker also analyses the property’s economics and the client’s strategy</td></tr>
<tr><td>Consultant</td><td>Gives advice but does not handle the deal</td><td>The broker brings the client to the result — the purchase</td></tr>
<tr><td>Investment adviser</td><td>Gives investment recommendations, often needs a licence</td><td>The broker gives no personal financial guarantees and does not manage the client’s money</td></tr></table>
<h3>Limits of responsibility</h3>
<table class="tbl"><tr><th>The broker does</th><th>The broker does not</th></tr>
<tr><td>Identifies the client’s goals and budget</td><td>Guarantee yield or price growth</td></tr>
<tr><td>Selects and compares properties</td><td>Give legal opinions — the lawyer does that</td></tr>
<tr><td>Prepares proposals and calculations</td><td>Accept the client’s money personally</td></tr>
<tr><td>Takes the client through the funnel and records everything in the CRM</td><td>Change deal terms without the manager’s approval</td></tr></table>
<div class="claim"><b>Legal status.</b> According to the official Thai government portal, “broker/agent” work is on the list of occupations prohibited for foreigners (Ministry of Labour notice of 2020); the penalty for working without the right is 5,000–50,000 baht and deportation. <span class="tbc">How the company’s brokers are engaged (country of work, contract, role) is confirmed by the company lawyer.</span> The broker does not start working with clients until the manager has confirmed their status.</div>
<h3>Main daily tasks</h3>
<ol><li>Reply to new enquiries.</li><li>Qualify clients.</li><li>Select properties and prepare proposals.</li><li>Run consultations and presentations.</li><li>Move clients to the next step.</li><li>Update the CRM.</li></ol>`,

<p class="muted">The broker shows their value — saving time and precision — instead of acting as a catalogue forwarder.</p>`,

<h3>The broker’s end product</h3>
<blockquote>A client who, based on verified information and a suitable offer, has made an informed decision to buy — and has completed the deal with the company’s support.</blockquote>
<p>Three key phrases in this definition:</p>
<ul><li><b>Verified information</b> — no invented figures or promises.</li><li><b>A suitable offer</b> — matching the client’s goal, not whatever is easiest to sell.</li><li><b>An informed decision</b> — the client understands risks, costs and scenarios.</li></ul>
<h3>The chain from action to result</h3>
<table class="tbl"><tr><th>Step</th><th>Result of the step</th><th>Sign that the step is done</th></tr>

 material:`
<p class="muted">Below is the set of metrics commonly used in real estate sales. <span class="tbc">Specific targets are approved by the company.</span></p>
<table class="tbl"><tr><th>Metric</th><th>Formula</th><th>What it shows</th><th>How to influence it</th></tr>
<tr><td>Leads handled</td><td>Number of leads that received a reply</td><td>Workload</td><td>Leave no enquiry unanswered</td></tr>
<tr><td>First response time</td><td>Time from enquiry to first reply</td><td>How many clients you “catch”</td><td>Notifications, first-message templates</td></tr>
<tr><td>Share of qualified leads</td><td>Qualified / handled × 100%</td><td>Quality of leads and questions</td><td>Qualification questionnaire</td></tr>
<tr><td>Consultations held</td><td>Number of calls and meetings held</td><td>Depth of work</td><td>Offer a specific time</td></tr>
<tr><td>Proposals prepared</td><td>Number of proposals sent</td><td>Moving to a choice</td><td>Proposal templates</td></tr>
<tr><td>Stage conversion</td><td>Moved to the next stage / at the stage × 100%</td><td>Where clients are lost</td><td>Analysis of losses</td></tr>
<tr><td>Reservations and deals</td><td>Number and amount</td><td>The final result</td><td>All the metrics above</td></tr>
<tr><td>CRM quality</td><td>Records with all required fields / all records × 100%</td><td>How manageable the work is</td><td>Fill in on the day of contact</td></tr>
<tr><td>Compliance with rules</td><td>Manager’s remarks</td><td>Reliability</td><td>Work to standards</td></tr></table>
<h3>An example of a conversion calculation</h3>
<p>In a month: 60 leads → 30 qualified → 15 consultations → 8 proposals → 2 reservations.</p>
<ul><li>Lead → qualification: 30 / 60 = <b>50%</b></li><li>Qualification → consultation: 15 / 30 = <b>50%</b></li><li>Consultation → proposal: 8 / 15 = <b>53%</b></li><li>Proposal → reservation: 2 / 8 = <b>25%</b></li></ul>
<p>The weakest point is the last stage: it is worth analysing why clients do not reserve after a proposal.</p>`,
 example:`<p>A broker sees that 80% of leads reach qualification, but only 20% of qualified clients agree to a consultation. Conclusion: the problem is not the leads but how he offers the consultation. Solution: offer a specific time and explain the benefit of the call.</p>`,
 checklist:['I know the 9 metrics and what they show','I can calculate stage conversion','I understand how to find the weak point in the funnel'],
 quiz:[
  {q:'40 qualified clients, 10 consultations. Conversion from qualification to consultation:', o:['10%','25%','40%','4%'], a:[1], e:'10 / 40 × 100% = 25%.'},
  {q:'What does first response time show?', o:['Property quality','How many clients the broker manages to “catch” before they go elsewhere','Deal amounts','The number of properties in the catalogue'], a:[1], e:'A fast reply is the key factor at the top of the funnel.'},
  {q:'Conversion is high at every stage except “proposal → reservation”. What should be analysed?', o:['Advertising','Proposal quality, prices and objection handling after the proposal','Response time','Nothing'], a:[1], e:'The weak point is the stage after the proposal.'}
 ],
 criteria:['Mini-check passed'],
 links:[]
},
{
 id:'2.6', title:'Motivation and income', min:25,
 goal:'Understand how a broker’s income is formed and be able to calculate it in different scenarios.',
 why:'Understanding motivation helps the broker plan their work instead of waiting for “one big deal”.',
 material:`
<div class="claim"><b>The actual terms of DI Phuket Property are not published.</b> Below is an <b>editable model</b>: the rates in the calculator are illustrative. <span class="tbc">The fixed part, commission rates, when the right to commission arises, payment timing and the split between deal participants are confirmed by the company.</span></div>
<h3>What a broker’s income usually consists of</h3>
<ul><li><b>Fixed part</b> — if provided.</li>
<li><b>Commission part</b> — the broker’s share of the commission the company earns on a deal.</li>
<li><b>Bonuses</b> — for meeting the plan, a large deal, etc.</li></ul>
<h3>Important to understand</h3>
<ul><li>The company’s commission and the broker’s share are different figures. The broker receives a share of the company’s commission, not of the property price.</li>
<li><b>When the right to commission arises</b> — usually after the company receives payment from the developer or seller. <span class="tbc">To be confirmed.</span></li>
<li>If several people took part in a deal (for example, a colleague passed on the lead), the commission is split according to company rules. <span class="tbc">To be confirmed.</span></li></ul>
<h3>Income calculator (training model)</h3>
<div data-widget="income"></div>
<p class="muted">Change the values to explore scenarios. The default values are illustrative.</p>`,
 example:`<p>Scenario: a $250,000 property, company commission (illustrative) 5%, broker’s share (illustrative) 30%. The company’s commission is $12,500, the broker’s income from the deal is $3,750. Two such deals per quarter with no fixed part give $7,500 per quarter.</p>`,
 checklist:['I understand the difference between the company’s commission and the broker’s share','I know the actual rates are confirmed by the company','I can calculate income from a deal'],
 quiz:[
  {q:'A $200,000 property, company commission 5%, broker’s share 30%. The broker’s income:', o:['$10,000','$3,000','$6,000','$60,000'], a:[1], e:'200,000 × 5% = 10,000; 10,000 × 30% = $3,000.'},
  {q:'What is the broker’s share calculated from?', o:['The property price','The company’s commission on the deal','The client’s budget','The rent'], a:[1], e:'The share comes from the commission the company received.'},
  {q:'May a newcomer be told about rates “like in other agencies”?', o:['Yes','No: the actual terms are confirmed by DI Phuket Property','Yes, roughly','Only verbally'], a:[1], e:'Assumptions must not be presented as company terms.'}
 ],
 practice:{title:'Income calculation in scenarios', task:'Use the calculator to work out the broker’s income in three scenarios: (1) one $150,000 deal; (2) two $250,000 deals; (3) one $600,000 deal. Use the calculator’s default rates. Write down the calculation and a conclusion: what work plan is needed to reach the desired income.', criteria:['The calculations are correct','The broker’s commission is calculated from the company’s commission','There is a conclusion about the work plan']},
 criteria:['Mini-check passed','The calculation is accepted by the mentor'],
 links:[]
},

 why:'A clear prospect helps set goals for the first months of work.',
 material:`
<div class="claim"><span class="tbc">The DI Phuket Property career structure is not published. Below is a typical model for real estate agencies. It is not the company’s actual structure until confirmed.</span></div>
<h3>Typical levels (example)</h3>
<table class="tbl"><tr><th>Level</th><th>What they can do</th><th>Example promotion criterion</th></tr>

<tr><td>Senior broker</td><td>Handles investors and large deals</td><td>Deal volume, client feedback</td></tr>
<tr><td>Mentor</td><td>Trains newcomers</td><td>Experience and quality of work</td></tr>
<tr><td>Head of a line / Head of Sales</td><td>Manages a team and a plan</td><td>Team results</td></tr></table>
<h3>Competencies that grow with experience</h3>
<ul><li>Knowledge of the market and properties</li><li>Investment calculations</li><li>Negotiation and objection handling</li><li>Support for complex deals</li><li>Mentoring</li></ul>`,

 ],

 id:'2.8', title:'Organisational matters', min:15,
 goal:'Know the schedule, reporting, rules for handing over clients, responsibility for data and the conditions for starting practice.',

 material:`
<table class="tbl"><tr><th>Question</th><th>Rule</th></tr>
<tr><td>Schedule and format</td><td><span class="tbc">Working hours, days, office/remote — to be confirmed</span></td></tr>

{
 id:'3.1', title:'Phuket as a place to live and invest', min:25,
 goal:'Know the key facts about Phuket: geography, tourism, infrastructure, demand drivers, advantages and limitations.',
 why:'A client buys not only a property but also a place. The broker must answer “what is life like here” and “why will there be demand here” with confidence.',
 material:`
<h3>Geography and accessibility</h3>
<p>Phuket is Thailand’s largest island, in the Andaman Sea, connected to the mainland by a bridge. In the north of the island is <b>Phuket International Airport (HKT)</b>. The west coast has the main beaches and resorts; the east and centre have Phuket Town and residential areas.</p>
<h3>Climate and seasonality</h3>
<p>Tropical climate. Roughly: <b>high season</b> runs from about November to April (dry, peak tourism), <b>low season</b> from May to October (rainy season, lower occupancy and rents). Seasonality directly affects rental income, and investors need to know this.</p>
<h3>Tourism is the main demand driver</h3>
<table class="tbl"><tr><th>Indicator</th><th>Value</th><th>Source</th></tr>
<tr><td>Forecast visits in 2026</td><td>13.8 million (−2.27%)</td><td>Colliers</td></tr>
<tr><td>Average length of stay</td><td>7.67 nights (+14% y/y)</td><td>Colliers</td></tr>
<tr><td>Foreign tourists by country, 2025</td><td>Russia 28.6%, China 26.8%, Australia 12.2%</td><td>Colliers</td></tr>
<tr><td>Airport international passengers, H2 2025</td><td>2.7 million (−1% y/y)</td><td>CBRE</td></tr></table>
<p class="muted">Data as of the sources’ publication (2025–2026). Check for fresh figures before using them with a client.</p>
<h3>Infrastructure for living</h3>
<p>International schools, private hospitals, supermarkets, marinas, golf courses. Families more often choose areas close to schools and hospitals (Chalong, Phuket Town, Bang Tao/Laguna); see topic 3.2 for details.</p>
<h3>Living on the island as a foreigner</h3>
<p>Buying property <b>does not by itself grant a visa</b>. Visa programmes (including long-term ones) are a separate matter. <span class="tbc">Current visa options for buyers — to be confirmed by the company lawyer.</span></p>
<h3>Advantages and limitations of the region</h3>
<table class="tbl"><tr><th>Advantages</th><th>Limitations</th></tr>
<tr><td>A steady international tourist flow</td><td>Seasonal rental demand</td></tr>
<tr><td>Developed resort infrastructure</td><td>Restrictions on land ownership for foreigners</td></tr>
<tr><td>A wide choice of projects</td><td>Large new supply means competition for tenants</td></tr>
<tr><td>An airport with direct flights</td><td>Dependence on tourism and external events</td></tr></table>`,
 example:`<p><b>Client:</b> “Won’t it be empty in summer?”</p><p><b>Broker:</b> “From May to October it’s the rainy season, so occupancy and rents are lower. That’s why our yield calculations include seasonality and show a cautious scenario. By the way, according to Colliers, the average trip to Phuket has grown to 7.7 nights — that’s good for rentals.”</p>`,
 checklist:['I know where the airport and the main beaches are','I know the high and low seasons','I can name 2–3 tourism figures with a source','I know that buying does not automatically grant a visa','I can name the region’s advantages and limitations'],
 quiz:[
  {q:'Which period is usually the high season in Phuket?', o:['May – October','Roughly November – April','December only','The same all year'], a:[1], e:'The dry season is the tourist peak; May to October is the rainy season.'},
  {q:'Does buying property automatically grant a visa?', o:['Yes','No, visa programmes are a separate matter','Yes, if it costs more than $100,000','Only for villas'], a:[1], e:'We do not promise a visa; the lawyer confirms the options.'},
  {q:'Which countries led among Phuket’s foreign tourists in 2025 (Colliers)?', o:['The USA and Germany','Russia and China','India and Japan','The UK and France'], a:[1], e:'Russia 28.6%, China 26.8%.'}
 ],
 criteria:['Mini-check passed'],
 links:srcLinks('col','cbre')
},

<tr><td>Townhouse</td><td>For living, cheaper than villas</td><td>Lower price than a villa</td><td>Same land rights as for villas</td></tr>
<tr><td>New development (off-plan)</td><td>Investors seeking growth, instalments</td><td>Lower price, instalments</td><td>Risk of construction delays and developer risk</td></tr>
<tr><td>Resale property</td><td>Those who want it “now”</td><td>You see the finished property, income starts immediately</td><td>Condition, history, seller’s taxes</td></tr>
<tr><td>Hotel and investment properties</td><td>Large investors</td><td>Business income</td><td>Requires due diligence and management</td></tr>
<tr><td>Land</td><td>Developers, long-term investors</td><td>Value growth over years</td><td>A foreigner cannot own land directly; the land document must be checked</td></tr></table>
<h3>Finished property or under construction</h3>
<p>In 2025 new condos cost on average 39% more than resale ones (C9 Hotelworks: 139,000 vs 100,000 baht/m²). A new development offers instalments and a new property; resale offers a finished property and sometimes a lower price.</p>`,
 example:`<p><b>Client:</b> “I want a villa in my own name.” <b>Broker:</b> “In Thailand a foreigner cannot own land directly. Villas are bought through a long-term land lease or other structures — our lawyer will tell you which suits you. If ownership is important, look at a condominium: there a foreigner can be the owner.”</p>`,

{
 id:'3.4', title:'Developers and development projects', min:20,
 goal:'Be able to check a developer and compare projects.',
 why:'Developer reliability is the main risk when buying a new development.',
 material:`
<h3>The developer market</h3>
<p>As of Q1 2025, <b>40,600 units in 343 projects</b> were on sale in Phuket, 83% of them condominiums (C9 Hotelworks). The largest by supply is RHOM Bho Property (4,820 units in 9 projects).</p>
<h3>Developer check checklist</h3>
<ol><li>How many years on the market, how many projects delivered and <b>whether they were on time</b>.</li>
<li>Whether you can visit completed projects and talk to owners.</li>
<li>Whether the project has the required permits: land, construction, environmental impact assessment (EIA) for large projects. The lawyer checks this.</li>
<li>Who owns the land under the project.</li>
<li>Whether there is escrow or bank oversight of payments. <span class="tbc">Check with the lawyer when applicable.</span></li>
<li>Who will manage the property and on what terms.</li>
<li>Reviews, court disputes, news.</li></ol>
<h3>How to compare projects</h3>
<table class="tbl"><tr><th>Criterion</th><th>What to look at</th></tr>
<tr><td>Location</td><td>Area, distance to the beach, noise</td></tr>
<tr><td>Developer</td><td>The checklist above</td></tr>
<tr><td>Stage</td><td>Foundations, frame, finishing, completed</td></tr>
<tr><td>Price per m²</td><td>Comparison with the market (topic 3.2)</td></tr>
<tr><td>Complex facilities</td><td>Pool, gym, reception, parking</td></tr>
<tr><td>Management and rental</td><td>Who manages, terms, reporting</td></tr>
<tr><td>Payments</td><td>Schedule, instalments, currency</td></tr></table>`,
 example:`<p>An investor is choosing between two projects in Bang Tao. The broker builds a table: the first developer has delivered 5 projects, the second is a newcomer with its first project. The second is 10% cheaper. The broker explains that the price difference is the price of risk and suggests visiting the first developer’s completed properties.</p>`,
 checklist:['I know the 7 points of a developer check','I compare projects on 7 criteria','I understand that permits are checked by the lawyer'],
 quiz:[
  {q:'What is most important to check about a new-development developer?', o:['The colour of the facade','Its track record of delivered projects and delivery dates','The amount of advertising','The logo'], a:[1], e:'The delivery record is the main indicator of reliability.'},

  {q:'A new developer is 10% cheaper. How do you explain this to the client?', o:['It is always better value','The price difference is the price of risk; extra checks are needed','They are scammers','Don’t explain'], a:[1], e:'Be honest about risks, without accusations.'}

{
 id:'3.6', title:'Investment economics', min:40,
 goal:'Be able to calculate the full purchase cost, ownership costs, gross and net yield and payback — in three scenarios.',
 why:'Investors decide based on numbers. An honest calculation with all costs is the main tool for building trust.',
 material:`
<h3>Terms</h3>
<table class="tbl"><tr><th>Term</th><th>What it is</th><th>Formula</th></tr>
<tr><td>Purchase cost</td><td>Price plus transaction costs</td><td>Price + taxes and fees + furniture</td></tr>
<tr><td>Gross yield</td><td>Rental income before costs</td><td>Annual rent / cost × 100%</td></tr>
<tr><td>Net yield</td><td>Income after all costs</td><td>(Rent − costs) / cost × 100%</td></tr>
<tr><td>ROI for a period</td><td>How much is earned on the capital invested</td><td>(Net income + price growth) / investment × 100%</td></tr>
<tr><td>Payback</td><td>Years until rent returns the investment</td><td>Cost / net income per year</td></tr>
<tr><td>Occupancy</td><td>The share of nights the property is rented</td><td>Nights rented / 365</td></tr></table>
<h3>Purchase costs (guidelines)</h3>
<ul><li>Transfer registration fee — <b>2%</b> of the appraised value; how it is split between the parties is negotiable, and developers often split it.</li>
<li>Specific Business Tax (SBT) of <b>3.3%</b> is paid by the seller if they owned the property for less than 5 years; otherwise a stamp duty of <b>0.5%</b>.</li>
<li>The seller’s withholding income tax — <span class="tbc">calculated by the Land Department; check with the lawyer</span>.</li>
<li>Furniture and equipment, if not included.</li></ul>
<p class="muted">Source: The Thaiger (legal overview); confirmed by the lawyer for each deal.</p>
<h3>Ownership costs</h3>
<p>Maintenance fees of the complex (sinking/common fee), utilities, management and the management company’s fee, cleaning, repairs, insurance, land and building tax (for a condo, about 0.02% of the appraised value). Currency risk: income is in baht, while the client counts in dollars or roubles.</p>
<h3>Market yield benchmarks</h3>
<p>The average <b>gross</b> yield of apartments in Phuket is <b>5.60%</b> (one-bedroom 6.07%, two-bedroom 5.71%, three-bedroom 5.02%), based on asking long-term rents; <b>net yield is usually 1.5–2 percentage points lower</b> (Global Property Guide, August 2026). This is not a forecast for a specific property.</p>
<div class="claim">All calculations in this training are for practice. A yield forecast is not a guarantee. Always show the client at least the cautious and the base scenario.</div>
<h3>Investment calculator</h3>
<div data-widget="invest"></div>`,
 example:`<p>A condo for 5,000,000 baht. Rent of 30,000 baht a month × 10 months of occupancy = 300,000 baht a year → gross yield 6%. Costs: maintenance 40,000, management at 15% of rent (45,000), other 20,000 = 105,000. Net income is 195,000 → net yield 3.9%, payback ≈ 25.6 years excluding price growth.</p>`,
 checklist:['I can tell gross yield from net yield','I know purchase and ownership costs','I can calculate payback','I show at least two scenarios'],
 quiz:[
  {q:'A property for 4,000,000 baht, rent of 240,000 baht a year, costs of 80,000. Net yield:', o:['6%','4%','2%','8%'], a:[1], e:'(240,000 − 80,000) / 4,000,000 = 4%.'},
  {q:'The transfer registration fee in Thailand:', o:['0.5%','2% of the appraised value','10%','None'], a:[1], e:'2%; the split is negotiable.'},
  {q:'The average gross yield of apartments in Phuket (Global Property Guide, 2026):', o:['About 15%','About 5.6%','About 50%','About 1%'], a:[1], e:'5.60% gross; net is 1.5–2 percentage points lower.'}
 ],
 practice:{title:'Net yield calculation', task:'Use the calculator for a property: price 6,500,000 baht, rent 38,000 baht/month, occupancy 75% (base scenario), maintenance 45,000 baht/year, management 20% of rent, other costs 25,000 baht/year. Write down gross and net yield and payback in three scenarios, and explain the result to the client in 3–4 sentences without promises.', criteria:['The figures are calculated correctly','All three scenarios are given','The explanation contains no yield guarantees','Risks are named: seasonality, currency']},
 criteria:['Mini-check passed','The calculation is accepted by the mentor'],
 links:srcLinks('gpg','thg')
},
{
 id:'3.7', title:'Legal aspects of buying in Thailand', min:35,
 goal:'Understand the basic rules of property ownership by foreigners so you can explain them correctly and bring in the lawyer in time.',
 why:'A mistake on a legal question is the most expensive mistake a broker can make. The broker explains general principles; conclusions about a specific deal are drawn by the lawyer.',
 material:`
<div class="claim"><b>This is general information, not legal advice.</b> Source: an overview by The Thaiger; every deal is checked by the lawyer. <span class="tbc">This section is to be approved by the company lawyer.</span></div>
<h3>Freehold and leasehold</h3>
<table class="tbl"><tr><th></th><th>Freehold (ownership)</th><th>Leasehold (lease)</th></tr>
<tr><td>What it is</td><td>Ownership without a time limit</td><td>A registered lease for a fixed term</td></tr>
<tr><td>For a foreigner</td><td>A condominium unit within the 49% quota</td><td>Land and houses — a maximum term of <b>30 years</b></td></tr>
<tr><td>Renewal</td><td>—</td><td>According to The Thaiger, after a Supreme Court ruling (March 2025), pre-agreed automatic renewals are invalid: a renewal requires a new registration with the landowner’s consent. <span class="tbc">To be checked by the lawyer.</span></td></tr></table>
<h3>Condominium: the 49% quota</h3>
<ul><li>Foreigners together may own no more than <b>49% of the saleable area</b> of a building (Condominium Act 1979, section 19).</li>
<li>Before paying a deposit, get written confirmation of the quota from the building’s management body (juristic person).</li>
<li>The money must come <b>in foreign currency from abroad</b> in the buyer’s name with the purpose “purchase of condominium”. For transfers from $50,000 the bank issues an FET form; for smaller amounts, a confirmation letter from the bank.</li></ul>
<h3>Land and houses</h3>
<ul><li>A foreigner cannot own land.</li>
<li>Legal options: a 30-year lease, usufruct (lifetime use), superficies (ownership of a building without the land).</li>
<li><b>Nominee Thai companies and “front” shareholders are illegal</b>; according to The Thaiger, enforcement was tightened from 1 January 2026, with penalties of up to 3 years in prison and a fine of up to 1 million baht. The broker never suggests such structures.</li></ul>
<h3>The document path</h3>
<ol><li>Reservation and reservation agreement.</li><li>Property and developer check by the lawyer.</li><li>Sale and purchase agreement.</li><li>Payments according to the schedule (for a condo, with a currency transfer document).</li><li>Registration at the Land Department and payment of taxes and fees.</li></ol>
<h3>Taxes and fees</h3><p>See topic 3.6: a 2% fee, SBT of 3.3% or stamp duty of 0.5%, the seller’s withholding tax.</p>
<h3>When the lawyer is mandatory</h3>
<p>Always: checking rights to the property and the land, the contract, the villa ownership structure, inheritance, buying through a company, hotels and land.</p>
<h3>The broker’s legal status</h3>
<p>The official Thai government portal lists “broker/agent” work among occupations prohibited for foreigners. <span class="tbc">The arrangement for the company’s brokers is confirmed by the lawyer.</span></p>`,
 example:`<p><b>Client:</b> “I was told to register the villa through a Thai company where I own 49% and the rest are nominees. Is that allowed?”</p><p><b>Broker:</b> “Structures with nominee shareholders are illegal in Thailand, and enforcement has been tightened. We don’t use such options. There are legal ways — a long-term land lease or superficies. I suggest a consultation with our lawyer, who will choose an option for your situation.”</p>`,
 checklist:['I can explain freehold and leasehold','I know the 49% quota and the currency transfer requirement','I know that a foreigner cannot own land','I know that nominee structures are illegal','I know when the lawyer must be brought in'],
 quiz:[
  {q:'The maximum term of a registered land lease:', o:['10 years','30 years','99 years','Unlimited'], a:[1], e:'30 years; renewal requires a new registration.'},
  {q:'What share of a condominium’s area may be owned by foreigners?', o:['100%','49%','25%','10%'], a:[1], e:'A 49% quota of the saleable area.'},
  {q:'A client suggests buying land through a company with nominee shareholders. Your answer:', o:['Good idea','It is illegal; I suggest legal options and a consultation with the lawyer','Not my business','I will help find nominees'], a:[1], e:'Nominee structures are illegal.'}
 ],
 practice:{title:'Explaining freehold and leasehold', task:'Write a message (6–10 sentences) to a client choosing between a freehold condo and a leasehold villa. Explain the difference in plain language, without legally inaccurate statements, and suggest a next step.', criteria:['Correct: a 49% quota for condos, a 30-year land lease','No promises of automatic renewal','A legal check is recommended','Plain language and a next step']},
 criteria:['Mini-check passed','The message is accepted by the mentor'],
 links:srcLinks('thg','gov')
},

 material:`

<tr><td>Listing portals</td><td>Many options</td><td>No checks and no support</td></tr>

<p><span class="tbc">Direct competitors of DI Phuket Property in management’s view — to be confirmed.</span></p>

<ul><li>Comparing projects from different developers.</li><li>A legal check before payment.</li><li>An economic calculation with all costs.</li><li>Management after the purchase.</li><li>The company’s experience since 2014.</li></ul>
<p>The rule: <b>we do not criticise competitors</b>; we compare on facts and service.</p>`,
