<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Академия брокера</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#f6f4ff;--bg2:#ebe6ff;--side:#4536a8;--card:#ffffff;--card2:#faf8ff;--bd:#e3ddfb;--bd2:#b3a5ff;
--fg:#1e1745;--muted:#5d5590;--dim:#8a83b5;--vio:#8b75ff;--lil:#6a52ee;--ok:#1fae5b;--bad:#ec4a5f;--warn:#e9a800;
--sh:0 10px 30px rgba(70,50,170,.08),0 1px 2px rgba(70,50,170,.06)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.6 Manrope,Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 500px at 95% -10%,rgba(165,148,255,.28),transparent 60%),radial-gradient(700px 500px at 15% 115%,rgba(165,148,255,.18),transparent 60%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed}
svg{stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--lil)}
button{font:inherit}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
/* sidebar */
aside{position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--side);color:#fff;
 --fg:#fff;--muted:#e1dcff;--bd:rgba(255,255,255,.2);--bd2:rgba(255,255,255,.5)}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 16px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1.5px solid #e0d9ff;color:#fff;font-weight:800;font-size:14px;flex:none}
.brand .t{font-weight:800;font-size:16px;line-height:1.2}
.brand .k{font-size:12px;color:#d8d2ff}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;cursor:pointer;color:#e1dcff;font-weight:600;font-size:14.5px;border:1px solid transparent;white-space:nowrap}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);flex:none}
.nav svg{width:16px;height:16px;stroke-width:1.8}
.nav .n{margin-left:auto;font-size:12px;font-weight:700;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:#ff7d8b;color:#fff}
.nav:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav.on{color:#fff;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border-color:rgba(255,255,255,.4)}
.nav:focus-visible{outline:2px solid #fff;outline-offset:2px}
.role{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.2);font-size:12px;color:#d8d2ff}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;margin-top:6px}
.seg button{all:unset;flex:1;text-align:center;padding:6px 4px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12.5px;color:#e1dcff}
.seg button.on{background:#fff;color:var(--side)}
/* main */
main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 44px;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.82);backdrop-filter:blur(10px);position:sticky;top:0;z-index:15}
.top .who{font-weight:800}
.top .meta{font-size:13px;color:var(--muted)}
.pbar{flex:1;min-width:140px;max-width:280px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.pbar .tr{flex:1;height:8px;border-radius:99px;background:#e9e4ff;overflow:hidden}
.pbar .tr i{display:block;height:100%;background:linear-gradient(90deg,#9d89ff,#6a52ee);border-radius:99px}
.bell{all:unset;box-sizing:border-box;position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--bd);background:#fff;cursor:pointer;color:var(--lil)}
.bell svg{width:18px;height:18px;stroke-width:1.8}
.bell b{position:absolute;top:-5px;right:-5px;font-size:11px;background:#ff7d8b;color:#fff;border-radius:99px;padding:0 6px;line-height:18px}
.drop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));max-height:70vh;overflow-y:auto;width:min(360px,calc(100vw - 32px));background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:8px;z-index:9}
.drop .it{padding:10px 12px;border-radius:10px;font-size:14px}
.drop .it.unread{background:#f3f0ff}
.drop-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 12px 4px}
.drop .it small{display:block;color:var(--dim);font-size:12px}
.wrap{padding:30px 44px 110px;max-width:1120px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.crumbs{font-size:13px;color:var(--dim);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--lil)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
h1{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:0 0 12px}
h1 em,h2 em{font-style:normal;background:linear-gradient(90deg,#9d89ff,#6a52ee);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:34px 0 14px}
.lead{font-size:17px;color:#2e2660;max-width:46rem;margin:0 0 8px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:22px 24px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--lil);color:#fff;transition:.15s}
.btn:hover{background:#5a42dc}
.btn.ghost{background:#fff;color:var(--lil);border:1px solid var(--bd2)}
.btn.ghost:hover{background:#f3f0ff}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--lil);outline-offset:2px}
.st{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-none{background:#eeebfb;color:var(--muted)}.s-doing{background:#e4ddff;color:#4a35c9}.s-review{background:#fcd34d;color:#4a3500}.s-rework{background:#ff7d8b;color:#fff}.s-done{background:#4ade80;color:#073b1d}.s-soon{background:#eeebfb;color:var(--dim)}
.next{display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,#6a52ee,#8b75ff);color:#fff;border:0}
.next .l{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.next .t{font-size:22px;font-weight:800;margin:4px 0}
.next .btn{background:#fff;color:var(--lil)}
.bcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.15s;text-align:left;font:inherit;color:inherit}
.bcard:hover{border-color:var(--bd2);transform:translateY(-2px)}
.bcard .num{font-size:12px;font-weight:800;color:var(--lil);letter-spacing:.08em;text-transform:uppercase}
.bcard .tt{font-size:17px;font-weight:800;line-height:1.25}
.bcard .rs{font-size:13.5px;color:var(--muted);flex:1}
.mini{height:6px;border-radius:99px;background:#eeebfb;overflow:hidden}.mini i{display:block;height:100%;background:var(--vio)}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.day{border-radius:12px;padding:10px 6px;text-align:center;background:#fff;border:1px solid var(--bd);font-size:12px;color:var(--muted)}
.day b{display:block;font-size:18px;color:var(--fg)}
.day.cur{background:var(--lil);border-color:var(--lil);color:#e9e4ff}.day.cur b{color:#fff}
.day.past{background:#f3f0ff}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}
.li .no{font-weight:800;color:var(--lil)}
.li .tt{font-weight:700}.li .ds{font-size:13.5px;color:var(--muted)}
.li .mn{font-size:12.5px;color:var(--dim);white-space:nowrap}
details.li{display:block}
details.li summary{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer;list-style:none}
details.li summary::-webkit-details-marker{display:none}
details.li ul{margin:8px 0 0 66px;color:var(--muted);font-size:14px;padding-left:18px}
/* topic */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 18px}
.stp{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:#fff;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.stp i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#eeebfb;font-size:11px}
.stp.on{background:var(--lil);color:#fff;border-color:var(--lil)}.stp.on i{background:rgba(255,255,255,.25)}
.stp.ok i{background:#4ade80;color:#073b1d}
.stp:focus-visible{outline:2px solid var(--lil)}
.goal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.goal .card{padding:16px 20px}
.goal .l{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lil);margin-bottom:4px}
.content{max-width:52rem}
.content h3{font-size:18px;font-weight:800;margin:24px 0 8px}
.content h3:first-child{margin-top:0}
.content p{margin:0 0 10px}
.content ul,.content ol{margin:0 0 12px;padding-left:22px}.content li{margin:4px 0}
.content blockquote{margin:0 0 12px;padding:14px 18px;border-left:3px solid var(--vio);background:#f3f0ff;border-radius:0 12px 12px 0;font-weight:700;font-size:16px}
.tbl{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:14.5px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--bd)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
.tblw{overflow-x:auto}
.tbc{background:#fff4cc;color:#6b4e00;border-radius:6px;padding:1px 6px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tbc::before{content:"⚑ ";font-size:11px}
.claim{background:#fff6f7;border:1px solid #ffd3d9;border-radius:12px;padding:12px 16px;margin:8px 0 14px;font-size:14.5px}
.tpl{background:var(--card2);border:1px dashed var(--bd2);border-radius:12px;padding:16px 20px}
.legend{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{width:20px;height:20px;accent-color:var(--lil);margin-top:2px;flex:none}
.q{padding:16px 0;border-top:1px solid var(--bd)}
.q:first-child{border-top:0}
.q .qt{font-weight:700;margin-bottom:8px}
.q .qt small{display:block;font-weight:600;color:var(--dim);font-size:12.5px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);margin:6px 0;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--bd2)}
.opt input{accent-color:var(--lil);margin-top:4px;flex:none}
.opt.right{border-color:#4ade80;background:#effdf4}.opt.wrong{border-color:#ff7d8b;background:#fff3f5}
.expl{font-size:14px;margin-top:6px;padding:8px 12px;border-radius:10px;background:#f3f0ff}
.score{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:14px;margin:14px 0}
.score.pass{background:#effdf4;border:1px solid #9be7b6}.score.fail{background:#fff3f5;border:1px solid #ffc2cb}
.score .v{font-size:34px;font-weight:800}
textarea,input[type=text],input[type=date],input[type=url],select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--fg)}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--vio);border-color:transparent}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 6px;letter-spacing:.04em}
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.comment{background:#f3f0ff;border-radius:12px;padding:12px 16px;margin-top:10px;font-size:14.5px}
.comment b{color:var(--lil)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:#fff;font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--lil);color:#fff;border-color:var(--lil)}
.kbi{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--bd);text-decoration:none;color:var(--fg)}
.kbi:first-child{border-top:0}
.kbi .sec{font-size:12px;color:var(--dim);min-width:90px}
.kbi .tt{flex:1;font-weight:600}
a.kbi:hover .tt{color:var(--lil)}
.org{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;background:var(--card2);border-radius:16px;border:1px solid var(--bd);margin:6px 0 10px}
.org-row,.org-top,.org-mid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ob{border:1px solid var(--bd2);background:#fff;border-radius:12px;padding:8px 14px;text-align:center;font-size:13.5px;min-width:150px}
.ob.main{background:var(--lil);color:#fff;border-color:var(--lil)}
.ob.you{background:#f3f0ff;border-width:2px}
.ob.soft{border-style:dashed}
.org-label{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.empty{color:var(--dim);font-size:14px;padding:8px 0}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.flag{font-size:13.5px;padding:8px 12px;border-radius:10px;background:#fff3f5;color:#a3122a;margin:8px 0}
.ok-note{font-size:13.5px;padding:8px 12px;border-radius:10px;background:#effdf4;color:#0b6b33;margin:8px 0}
@media (max-width:1000px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.days{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:820px){.app{grid-template-columns:1fr}
 .wrap{padding:22px 16px 110px}
 h1{font-size:30px}.g2,.g3,.goal{grid-template-columns:minmax(0,1fr)}.li{grid-template-columns:40px minmax(0,1fr)}.li .mn,.li .st{grid-column:2}
}

.navlbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#bfb6ff;padding:14px 12px 4px}
.nav .nt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.nav .nt small{font-size:11.5px;font-weight:600;color:#c9c1ff}
.nav{padding:8px 12px}
.nav .ic.step{font-size:12.5px;font-weight:800;color:#fff}
.nav .ic.s-done{background:#4ade80;border-color:#4ade80;color:#073b1d}
.nav .ic.s-review{background:#fcd34d;border-color:#fcd34d;color:#4a3500}
.nav .ic.s-rework{background:#ff7d8b;border-color:#ff7d8b}
.nav .ic.s-doing{background:rgba(255,255,255,.28)}
.nav.locked{opacity:.55}
.path{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:4px}
.path::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:2px;background:linear-gradient(#b3a5ff,#e3ddfb)}
.pstep{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:start;position:relative}
.pdot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff;border:2px solid var(--bd2);color:var(--lil);z-index:1;margin-top:18px}
.pdot svg{width:16px;height:16px;stroke-width:2}
.pdot.s-done{background:#4ade80;border-color:#4ade80;color:#073b1d}
.pdot.s-doing,.pdot.s-review,.pdot.s-rework{background:var(--lil);border-color:var(--lil);color:#fff}
.pstep.locked .pcard{opacity:.65}
.pstep.locked .pdot{color:var(--dim);border-color:var(--bd)}
.ptitle{font-size:19px;font-weight:800;margin:6px 0 8px}
.pgain .l{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lil)}
.pgain ul{margin:4px 0 0;padding-left:20px;font-size:14.5px;color:#2e2660}
.pgain li{margin:2px 0}
.calc{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin:8px 0 12px}
.calc input[type=number]{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:#fff}
.calcout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.calcout div{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.calcout b{font-size:20px;color:var(--fg)}
.dmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:14px}
.dcard{margin:12px 0;border:1px solid var(--bd2);border-radius:14px;padding:14px 16px;background:#fff}
@media (max-width:820px){.calcout,.dmap{grid-template-columns:1fr 1fr}.path::before{left:19px}.pstep{grid-template-columns:32px minmax(0,1fr);gap:10px}.pdot{width:32px;height:32px}}

.kbcard{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--fg);transition:.15s}.kbcard:hover{border-color:var(--bd2);transform:translateY(-2px)}.kbcard .muted{font-size:13.5px}

.ag-fab{all:unset;position:fixed;right:24px;bottom:24px;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:linear-gradient(120deg,#6a52ee,#8b75ff);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(90,66,220,.35)}
.ag-fab svg,.btn svg{width:18px;height:18px;stroke-width:1.8}
.ag-fab:focus-visible{outline:3px solid #b3a5ff;outline-offset:3px}
.agent{position:fixed;right:24px;bottom:24px;z-index:30;width:min(420px,calc(100vw - 32px));height:min(620px,calc(100vh - 48px));background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 24px 60px rgba(40,25,120,.25);display:flex;flex-direction:column;overflow:hidden}
.agent[hidden]{display:none}
.ag-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(120deg,#4536a8,#6a52ee);color:#fff}
.ag-head small{display:block;font-size:12px;color:#e1dcff}
.ag-av{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}.ag-av svg{width:20px;height:20px;stroke-width:1.8}
.ag-x{all:unset;margin-left:auto;cursor:pointer;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}.ag-x:hover{background:rgba(255,255,255,.15)}
.ag-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ag-msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5}
.ag-msg ul{margin:4px 0;padding-left:18px}
.ag-msg.bot{background:#fff;border:1px solid var(--bd);align-self:flex-start;border-bottom-left-radius:4px}

.login-card>p.muted{margin:0 0 6px;font-size:14.5px}
.login-brand{padding:0;color:var(--fg)}.login-brand .logo{background:var(--side);border-color:var(--side)}.login-brand .k{color:var(--muted)}
.login-btn{width:100%;justify-content:center;margin-top:16px;padding:12px 18px}
.login-help{font-size:13.5px;color:var(--muted);margin:14px 0 0;text-align:center}
.login-demo{margin-top:14px;padding:10px 12px;border-radius:12px;background:#f3f0ff;font-size:13.5px;color:var(--muted);text-align:center}
.login-demo b{color:var(--fg);font-variant-numeric:tabular-nums}
.login-lang{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.pw{position:relative}.pw input{padding-right:46px}
.pw-eye{all:unset;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--dim);cursor:pointer}
.pw-eye svg{width:18px;height:18px;stroke-width:1.8}.pw-eye.on{color:var(--lil)}.pw-eye:focus-visible{outline:2px solid var(--lil)}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--fg)}
.nav .ic.step svg{width:15px;height:15px}

<h3>Формула аргумента</h3>

<p>Пример: «Мы работаем с 2014 года (факт) — значит, видели разные циклы рынка и знаем, какие застройщики сдают объекты в срок (польза). Могу показать объекты, которые мы продавали и сейчас ведём в управлении (подтверждение)».</p>

<tr><td>Риелтор (в бытовом смысле)</td><td>Показывает объекты и проводит сделку</td><td>Брокер дополнительно разбирает экономику объекта и стратегию клиента</td></tr>
<tr><td>Консультант</td><td>Даёт советы, не ведёт сделку</td><td>Брокер доводит клиента до результата — покупки</td></tr>
<tr><td>Инвестиционный советник</td><td>Даёт рекомендации по вложениям, часто требует лицензии</td><td>Брокер не даёт персональных финансовых гарантий и не управляет деньгами клиента</td></tr></table>
<h3>Границы ответственности</h3>
<table class="tbl"><tr><th>Брокер делает</th><th>Брокер не делает</th></tr>
<tr><td>Выявляет цели и бюджет клиента</td><td>Не гарантирует доходность и рост цены</td></tr>
<tr><td>Подбирает и сравнивает объекты</td><td>Не даёт юридических заключений — это делает юрист</td></tr>
<tr><td>Готовит КП и расчёты</td><td>Не принимает деньги клиента лично</td></tr>
<tr><td>Ведёт клиента по воронке и фиксирует всё в CRM</td><td>Не меняет условия сделки без согласования с руководителем</td></tr></table>
<div class="claim"><b>Правовой статус.</b> По данным официального портала Таиланда, работа «брокера/агента» входит в список занятий, запрещённых для иностранцев (объявление Министерства труда 2020 года); штраф за работу без права — 5 000–50 000 бат и депортация. <span class="tbc">Как оформлена работа брокеров компании (страна работы, договор, роль) — подтверждает юрист компании.</span> Брокер не начинает работу с клиентами, пока руководитель не подтвердил его статус.</div>
<h3>Основные ежедневные задачи</h3>
<ol><li>Отвечать на новые обращения.</li><li>Квалифицировать клиентов.</li><li>Подбирать объекты и готовить предложения.</li><li>Проводить консультации и презентации.</li><li>Вести клиентов к следующему шагу.</li><li>Обновлять CRM.</li></ol>`,
 example:`<p><b>Клиент:</b> «Вы мне просто скиньте всё, что есть до 300 тысяч долларов, я сам выберу».</p>
<p><b>Брокер:</b> «Могу, но это будет больше сотни объектов, и половина вам не подойдёт. Давайте за 10 минут я уточню цель покупки и пару деталей — и пришлю 3–5 вариантов с расчётом, которые действительно подходят. Сэкономим вам неделю».</p>
<p class="muted">Брокер показывает свою ценность — экономию времени и точность — вместо роли «пересыльщика каталога».</p>`,
 checklist:['Могу объяснить, кто такой брокер, одним предложением','Называю 4 вида ценности для клиента','Знаю, чем брокер отличается от консультанта и инвест-советника','Знаю, чего брокер не делает','Знаю, что правовой статус работы подтверждает юрист компании'],
 quiz:[
  {q:'Что из перечисленного — зона ответственности брокера?', o:['Юридическое заключение о чистоте объекта','Подбор объектов и расчёт полной стоимости владения','Гарантия роста цены','Приём денег клиента на свою карту'], a:[1], e:'Юридические заключения даёт юрист, гарантий брокер не даёт, деньги лично не принимает.'},
  {q:'Клиент просит «скинуть всё до 300 тысяч». Лучшая реакция:', o:['Отправить весь каталог','Уточнить цель и критерии, затем прислать 3–5 подходящих вариантов','Отказать','Отправить самые дорогие объекты'], a:[1], e:'Ценность брокера — точный подбор, а не объём.'},
  {q:'Что говорит официальный портал Таиланда о работе «брокера/агента» для иностранцев?', o:['Разрешена без ограничений','Входит в список запрещённых для иностранцев занятий','Разрешена только в Бангкоке','Требует только туристической визы'], a:[1], e:'Пункт «Broker/agent job» — в списке запрещённых занятий (2020). Статус работы брокеров компании подтверждает юрист.'}
 ],
 criteria:['Мини-проверка сдана','Брокер объясняет свою роль и её границы'],
 links:[['Портал Таиланда: работы, запрещённые для иностранцев','https://www.thailand.go.th/event-detail/007-010']]
},
{
 id:'2.2', title:'Ценный конечный продукт должности', min:15,
 goal:'Понимать, какой результат работы брокера считается ценным, и как ежедневные действия ведут к нему.',
 why:'Брокер, который мерит работу только сделками, теряет клиентов на ранних этапах. Брокер, который понимает свой продукт, системно ведёт каждого клиента к решению.',
 material:`
<h3>Конечный продукт брокера</h3>
<blockquote>Клиент, который на основе проверенной информации и подходящего предложения принял осознанное решение о покупке — и прошёл сделку при поддержке компании.</blockquote>
<p>В формулировке три важных слова:</p>
<ul><li><b>Проверенная информация</b> — без выдуманных цифр и обещаний.</li><li><b>Подходящее предложение</b> — под цель клиента, а не под то, что легче продать.</li><li><b>Осознанное решение</b> — клиент понимает риски, расходы и сценарии.</li></ul>
<h3>Цепочка от действия к результату</h3>
<table class="tbl"><tr><th>Шаг</th><th>Результат шага</th><th>Признак, что шаг сделан</th></tr>
<tr><td>Квалификация</td><td>Понятны цель, бюджет, срок</td><td>Карточка клиента в CRM заполнена</td></tr>
<tr><td>Подбор</td><td>3–5 подходящих объектов</td><td>Подборка отправлена клиенту</td></tr>
<tr><td>Консультация</td><td>Клиент понимает варианты и экономику</td><td>Состоялся созвон или встреча</td></tr>
<tr><td>Презентация</td><td>Клиент выбрал 1–2 объекта</td><td>Отправлено КП с расчётом</td></tr>
<tr><td>Следующий шаг</td><td>Просмотр, бронь или новый подбор</td><td>Дата следующего контакта в CRM</td></tr>
<tr><td>Сделка</td><td>Бронирование и договор</td><td>Бронь оплачена</td></tr>
<tr><td>Сопровождение</td><td>Объект получен, передан в управление</td><td>Клиент доволен и рекомендует</td></tr></table>
<h3>Главное правило</h3>
<p>У каждого клиента в работе всегда есть <b>следующий шаг с датой</b>. Клиент без следующего шага — потерянный клиент.</p>`,
 example:`<p>Брокер провёл хорошую консультацию, клиенту понравились два объекта. Ошибка: закончить разговор словами «подумайте и напишите». Правильно: «Давайте в четверг в 15:00 созвонимся на 15 минут — я покажу видео обоих объектов и уточню наличие. Подходит?»</p>`,
 checklist:['Могу сформулировать конечный продукт брокера','Знаю цепочку: квалификация → подбор → консультация → презентация → шаг → сделка → сопровождение','Знаю правило «всегда следующий шаг с датой»'],
 quiz:[
  {q:'Что является ценным конечным продуктом брокера?', o:['Количество звонков в день','Клиент, принявший осознанное решение на основе проверенной информации и прошедший сделку','Отправленный каталог','Подписка клиента на рассылку'], a:[1], e:'Продукт — осознанное решение и сделка, а не активность сама по себе.'},
  {q:'Консультация прошла хорошо. Как её закончить?', o:['«Подумайте и напишите»','Договориться о конкретном следующем шаге с датой','Ничего не говорить','Сразу прислать договор'], a:[1], e:'Клиент без следующего шага теряется.'},
  {q:'Какой признак того, что квалификация сделана?', o:['Клиент поздоровался','Карточка клиента заполнена: цель, бюджет, срок','Отправлена презентация компании','Клиент подписан на Instagram'], a:[1], e:'Квалификация — это понятные цель, бюджет и срок, зафиксированные в CRM.'}
 ],
 criteria:['Мини-проверка сдана'],
 links:[]
},
{
 id:'2.3', title:'Обязанности и бизнес-процессы', min:20,
 goal:'Знать, из каких процессов состоит работа брокера и что нужно сделать на каждом.',
 why:'Процессы — это порядок, который не зависит от настроения и памяти. Брокер, который работает по процессу, не теряет заявки и не забывает клиентов.',
 material:`
<h3>Основные процессы</h3>
<table class="tbl"><tr><th>Процесс</th><th>Что делает брокер</th><th>Стандарт</th></tr>
<tr><td>Обработка заявки</td><td>Отвечает, знакомится, уточняет запрос</td><td>Ответ в рабочее время — как можно быстрее; <span class="tbc">норматив в минутах подтвердить</span></td></tr>
<tr><td>Квалификация</td><td>Узнаёт цель, бюджет, срок, район, тип, участников решения</td><td>Все поля в CRM заполнены</td></tr>
<tr><td>Подбор</td><td>Отбирает 3–5 объектов, проверяет актуальность цены и наличия</td><td>Цены проверены в день отправки</td></tr>
<tr><td>Предложение</td><td>Готовит КП с расчётом и следующим шагом</td><td>По шаблону компании</td></tr>
<tr><td>Встречи и просмотры</td><td>Организует онлайн-показ или просмотр на месте</td><td>Подтверждение за день до встречи</td></tr>
<tr><td>Фиксация</td><td>Записывает каждый контакт в CRM</td><td>В день контакта</td></tr>
<tr><td>Сопровождение сделки</td><td>Координирует бронь, юриста, оплату, регистрацию</td><td>Клиент знает статус на каждом этапе</td></tr>
<tr><td>Работа с действующими клиентами</td><td>Поддерживает связь после сделки</td><td>Контакт не реже <span class="tbc">периодичность подтвердить</span></td></tr></table>
<h3>С кем брокер взаимодействует</h3>
<p>Юрист — проверка объекта и договора. Подбор и каталог — актуальность объектов. Управление недвижимостью — аренда после покупки. Руководитель — условия сверх полномочий. Подробно — в теме 1.4.</p>
<h3>Типичная ошибка</h3>
<p>Вести клиентов «в голове» или в личном мессенджере. Если брокер заболел или ушёл в отпуск, коллега должен открыть CRM и за 2 минуты понять, что происходит с клиентом.</p>`,
 example:`<p><b>Ситуация:</b> в пятницу вечером приходит заявка из рекламы. Брокер отвечает сразу: представляется, благодарит, задаёт 1–2 вопроса о цели покупки и предлагает созвониться в понедельник в удобное время. Создаёт карточку в CRM, ставит задачу на понедельник.</p>`,
 checklist:['Знаю 8 основных процессов','Знаю, кого подключать на каждом этапе','Понимаю, почему всё фиксируется в CRM в день контакта'],
 quiz:[
  {q:'Когда фиксировать контакт с клиентом в CRM?', o:['В конце недели','В день контакта','Только после сделки','Не обязательно'], a:[1], e:'Стандарт — в день контакта.'},
  {q:'Перед отправкой подборки клиенту брокер обязательно:', o:['Проверяет актуальность цены и наличия','Добавляет все объекты каталога','Удаляет цены','Ставит скидку'], a:[0], e:'Неактуальная цена разрушает доверие.'},
  {q:'Заявка пришла в пятницу вечером. Что правильно?', o:['Ответить в понедельник','Ответить сразу, договориться о созвоне, создать карточку и задачу','Передать коллеге без комментария','Ничего'], a:[1], e:'Быстрый ответ и задача в CRM сохраняют клиента.'}
 ],
 criteria:['Мини-проверка сдана'],
 links:[]
},
{
 id:'2.4', title:'Рабочий день брокера', min:15,
 goal:'Уметь планировать день так, чтобы ни один клиент не остался без внимания.',
 why:'Без плана день уходит на срочное, а важное (подбор, КП, следующий шаг) откладывается.',
 material:`
<h3>Пример стандартного рабочего дня</h3>
<p class="muted">Учебный пример. <span class="tbc">График работы и часовой пояс клиентов подтверждает компания.</span></p>
<table class="tbl"><tr><th>Время</th><th>Задача</th></tr>
<tr><td>09:30–10:00</td><td>Проверка задач в CRM, просроченные — в приоритет</td></tr>
<tr><td>10:00–11:00</td><td>Ответы на новые обращения</td></tr>
<tr><td>11:00–13:00</td><td>Звонки и переписка с клиентами в работе</td></tr>
<tr><td>13:00–14:00</td><td>Обед</td></tr>
<tr><td>14:00–16:00</td><td>Подбор объектов, подготовка КП</td></tr>
<tr><td>16:00–18:00</td><td>Презентации и встречи (часто совпадает с утром клиентов в Европе)</td></tr>
<tr><td>18:00–18:30</td><td>Обновление CRM, отчёт, план на завтра</td></tr></table>
<h3>Правила планирования</h3>
<ol><li><b>Сначала новые заявки и просроченные задачи.</b></li>
<li><b>Учитывайте часовой пояс клиента.</b> Пхукет — UTC+7; Москва — UTC+3, то есть на Пхукете на 4 часа позже.</li>
<li><b>Блоки времени.</b> Подбор и КП требуют концентрации — не делайте их между звонками.</li>
<li><b>Каждый день заканчивается планом на завтра.</b></li></ol>`,
 example:`<p>Клиент из Москвы просит созвон «после работы, в 19:00». На Пхукете в это время 23:00. Брокер предлагает: «Удобно ли в 18:00 по Москве? У нас будет 22:00 — я на связи» или предлагает перенести звонок на выходные — в зависимости от правил компании о времени звонков.</p>`,
 checklist:['Знаю порядок приоритетов в начале дня','Учитываю разницу во времени с клиентом','Заканчиваю день планом на завтра'],
 quiz:[
  {q:'С чего начинается рабочий день брокера?', o:['С соцсетей','С проверки задач в CRM: новые заявки и просроченные задачи','С подбора объектов','С обеда'], a:[1], e:'Сначала то, что может потерять клиента.'},
  {q:'Клиент в Москве хочет созвон в 19:00 по Москве. Сколько это на Пхукете?', o:['15:00','19:00','23:00','21:00'], a:[2], e:'Пхукет UTC+7, Москва UTC+3 — разница 4 часа.'},
  {q:'Когда лучше готовить КП?', o:['Между звонками по 5 минут','В отдельный блок времени без отвлечений','Ночью','Во время встречи с клиентом'], a:[1], e:'КП требует концентрации.'}
 ],
 practice:{title:'План рабочего дня', task:'Составьте план своего рабочего дня: 3 новые заявки, 2 консультации (одна с клиентом из Москвы в 18:00 по Москве), 1 КП для инвестора, 4 задачи в CRM просрочены. Укажите время и порядок, объясните приоритеты.', criteria:['Просроченные задачи и новые заявки — в начале','Время с клиентом из Москвы пересчитано верно (22:00 на Пхукете)','КП — в отдельном блоке','В конце дня — CRM и план на завтра']},
 criteria:['Мини-проверка сдана','План дня принят наставником'],
 links:[]
},
{
 id:'2.5', title:'KPI и показатели', min:25,
 goal:'Понимать, какими показателями измеряется работа брокера, как они считаются и как на них влиять.',
 why:'KPI показывают, где в воронке брокер теряет клиентов. Зная формулу, можно точно понять, что улучшать.',
 material:`
<p class="muted">Ниже — состав показателей, принятый в продажах недвижимости. <span class="tbc">Конкретные нормативы (целевые значения) утверждает компания.</span></p>
<table class="tbl"><tr><th>Показатель</th><th>Формула</th><th>Что показывает</th><th>Как влиять</th></tr>
<tr><td>Обработанные лиды</td><td>Число лидов, получивших ответ</td><td>Объём работы</td><td>Не оставлять заявки без ответа</td></tr>
<tr><td>Скорость первого ответа</td><td>Время от заявки до первого ответа</td><td>Сколько клиентов вы «успеваете»</td><td>Уведомления, шаблоны первого сообщения</td></tr>
<tr><td>Доля квалифицированных</td><td>Квалифицированные / обработанные × 100%</td><td>Качество лидов и вопросов</td><td>Опросник квалификации</td></tr>
<tr><td>Состоявшиеся консультации</td><td>Число проведённых созвонов и встреч</td><td>Глубина работы</td><td>Предлагать конкретное время</td></tr>
<tr><td>Подготовленные КП</td><td>Число отправленных КП</td><td>Переход к выбору</td><td>Шаблоны КП</td></tr>
<tr><td>Конверсия этапа</td><td>Перешли на следующий этап / на этапе × 100%</td><td>Где теряются клиенты</td><td>Разбор потерь</td></tr>
<tr><td>Бронирования и сделки</td><td>Число и сумма</td><td>Итоговый результат</td><td>Все показатели выше</td></tr>
<tr><td>Качество CRM</td><td>Карточки с заполненными обязательными полями / все × 100%</td><td>Управляемость работы</td><td>Заполнять в день контакта</td></tr>
<tr><td>Соблюдение регламентов</td><td>Замечания руководителя</td><td>Надёжность</td><td>Работать по стандартам</td></tr></table>
<h3>Пример расчёта конверсии</h3>
<p>За месяц: 60 лидов → 30 квалифицированных → 15 консультаций → 8 КП → 2 брони.</p>
<ul><li>Лид → квалификация: 30 / 60 = <b>50%</b></li><li>Квалификация → консультация: 15 / 30 = <b>50%</b></li><li>Консультация → КП: 8 / 15 = <b>53%</b></li><li>КП → бронь: 2 / 8 = <b>25%</b></li></ul>

 goal:'Знать ключевые факты о Пхукете: география, туризм, инфраструктура, факторы спроса, плюсы и ограничения.',
 why:'Клиент покупает не только объект, но и место. Брокер должен уверенно отвечать на вопросы «как здесь жить» и «почему здесь будет спрос».',
 material:`
<h3>География и доступность</h3>
<p>Пхукет — крупнейший остров Таиланда, в Андаманском море, соединён с материком мостом. На севере острова — <b>международный аэропорт Пхукет (HKT)</b>. Западное побережье — главные пляжи и курорты; восток и центр — город Пхукет и жилые районы.</p>
<h3>Климат и сезонность</h3>
<p>Тропический климат. Условно: <b>высокий сезон</b> — примерно с ноября по апрель (сухо, пик туристов), <b>низкий</b> — с мая по октябрь (сезон дождей, ниже загрузка и цены аренды). Сезонность напрямую влияет на доход от аренды — это нужно объяснять инвесторам.</p>
<h3>Туризм — главный фактор спроса</h3>
<table class="tbl"><tr><th>Показатель</th><th>Значение</th><th>Источник</th></tr>
<tr><td>Прогноз визитов на 2026 год</td><td>13,8 млн (−2,27%)</td><td>Colliers</td></tr>
<tr><td>Средняя длительность пребывания</td><td>7,67 ночи (+14% г/г)</td><td>Colliers</td></tr>
<tr><td>Структура иностранных туристов, 2025</td><td>Россия 28,6%, Китай 26,8%, Австралия 12,2%</td><td>Colliers</td></tr>
<tr><td>Международные пассажиры аэропорта, II полугодие 2025</td><td>2,7 млн (−1% г/г)</td><td>CBRE</td></tr></table>
<p class="muted">Данные на дату публикации источников (2025–2026). Перед использованием в разговоре с клиентом — проверьте свежие цифры.</p>
<h3>Инфраструктура для жизни</h3>
<p>Международные школы, частные госпитали, супермаркеты, марины, гольф-поля. Семьи чаще выбирают районы рядом со школами и больницами (Chalong, Phuket Town, Bang Tao/Laguna); подробно — в теме 3.2.</p>
<h3>Особенности проживания иностранцев</h3>
<p>Покупка недвижимости <b>сама по себе не даёт визы</b>. Визовые программы (в т. ч. долгосрочные) — отдельный вопрос. <span class="tbc">Актуальные визовые варианты для покупателей — подтвердить юристом компании.</span></p>
<h3>Плюсы и ограничения региона</h3>
<table class="tbl"><tr><th>Плюсы</th><th>Ограничения</th></tr>
<tr><td>Стабильный международный турпоток</td><td>Сезонность аренды</td></tr>
<tr><td>Развитая курортная инфраструктура</td><td>Ограничения на владение землёй для иностранцев</td></tr>
<tr><td>Большой выбор проектов</td><td>Большое новое предложение = конкуренция за арендаторов</td></tr>
<tr><td>Аэропорт с прямыми рейсами</td><td>Зависимость от туризма и внешних событий</td></tr></table>`,
 example:`<p><b>Клиент:</b> «А не будет ли пусто летом?»</p><p><b>Брокер:</b> «С мая по октябрь — сезон дождей, загрузка и цены аренды ниже. Поэтому в расчётах доходности мы закладываем сезонность и показываем осторожный сценарий. Кстати, по данным Colliers, средняя поездка на Пхукет выросла до 7,7 ночи — это хорошо для аренды».</p>`,
 checklist:['Знаю, где аэропорт и главные пляжи','Знаю высокий и низкий сезон','Могу назвать 2–3 цифры по туризму с источником','Знаю, что покупка не даёт визу автоматически','Называю плюсы и ограничения региона'],
 quiz:[
  {q:'Какой период обычно считается высоким сезоном на Пхукете?', o:['Май — октябрь','Примерно ноябрь — апрель','Только декабрь','Круглый год одинаково'], a:[1], e:'Сухой сезон — пик туристов; с мая по октябрь — дожди.'},
  {q:'Даёт ли покупка недвижимости визу автоматически?', o:['Да','Нет, визовые программы — отдельный вопрос','Да, если дороже 100 000 $','Только виллы'], a:[1], e:'Не обещаем визу; подтверждает юрист.'},
  {q:'Какие страны лидировали среди иностранных туристов Пхукета в 2025 году (Colliers)?', o:['США и Германия','Россия и Китай','Индия и Япония','Великобритания и Франция'], a:[1], e:'Россия 28,6%, Китай 26,8%.'}
 ],
 criteria:['Мини-проверка сдана'],
 links:srcLinks('col','cbre')
},
{
 id:'3.2', title:'Районы Пхукета', min:40,
 goal:'Знать ключевые районы, их характер, покупателей и уметь рекомендовать район под запрос клиента.',
 why:'Район определяет и качество жизни, и доход от аренды. Неверный район — самая частая причина разочарования покупателя.',
 material:`
<h3>Интерактивная карта районов</h3>
<p>Нажмите на район, чтобы открыть карточку. Схема — по побережьям, не в масштабе.</p>
<div data-widget="districts"></div>
<h3>Сравнение районов</h3>
<p class="muted">Ориентир «для чего подходит» — экспертная оценка для обучения, не обещание доходности или роста цены.</p>
<div data-widget="districts-table"></div>
<h3>Цены: что известно и с какой даты</h3>
<table class="tbl"><tr><th>Показатель</th><th>Значение</th><th>Источник и период</th></tr>
<tr><td>Медианная цена кондо</td><td>144 000 бат/м²</td><td>C9 Hotelworks, 2025</td></tr>
<tr><td>Средняя цена кондо</td><td>149 070 бат/м²; прогноз 2026 — 150 000</td><td>Colliers, 2025</td></tr>
<tr><td>Медианная цена вилл / домов</td><td>70 000 бат/м²</td><td>C9 Hotelworks, 2025</td></tr>
<tr><td>Брендированные кондо</td><td>181 000 бат/м² (+28% к небрендированным)</td><td>C9 Hotelworks, 2025</td></tr>
<tr><td>Новое кондо vs вторичка</td><td>139 000 vs 100 000 бат/м² (+39%)</td><td>C9 Hotelworks, 2025</td></tr>
<tr><td>Максимальная цена кондо с одной спальней</td><td>Cherngtalay 19,4 млн, Rawai 15,4 млн, Karon 9,1 млн бат</td><td>C9 Hotelworks, 2025</td></tr></table>
<p><span class="tbc">Цены по районам из каталога компании — добавить, когда будет доступ к каталогу.</span></p>`,
 example:`<p><b>Запрос:</b> семья с двумя детьми переезжает на год, бюджет на покупку есть, нужна школа рядом.</p><p><b>Брокер:</b> рекомендует сравнить Bang Tao / Laguna (курортная инфраструктура, школы рядом) и Chalong (жилой район с инфраструктурой круглый год), объясняет плюсы и минусы, а Patong не предлагает — шумно и не для семей.</p>`,
 checklist:['Знаю 13 районов и их зону на острове','Могу подобрать 2 района под запрос семьи, инвестора в аренду и покупателя для жизни','Называю цены только с источником и датой'],
 quiz:[
  {q:'Какой район менее всего подходит семье с маленькими детьми для постоянной жизни?', o:['Chalong','Patong','Laguna','Kata'], a:[1], e:'Patong — туристический центр с ночной жизнью.'},
  {q:'Какой район дал 44% новых кондо-проектов в 2024 году (Colliers)?', o:['Rawai','Bang Tao','Phuket Town','Mai Khao'], a:[1], e:'Bang Tao — самый активный район новых проектов.'},
  {q:'Как правильно назвать клиенту цену за м²?', o:['«Примерно сто тысяч»','С источником и датой: «медиана кондо — 144 000 бат/м², C9 Hotelworks, 2025»','Не называть','Взять с любого сайта'], a:[1], e:'Рыночные цифры — только с источником и периодом.'}
 ],
 practice:{title:'Район для семьи с детьми', task:'Семья (двое детей 7 и 10 лет) переезжает на Пхукет на 2 года, хочет жить у моря и чтобы школа была не дальше 20 минут. Предложите 2 района, объясните выбор (плюсы и ограничения) и какой район вы не предложите и почему.', criteria:['Районы подходят для жизни семьи','Указаны и плюсы, и ограничения','Нет обещаний роста цены','Аргумент, почему не подходит другой район']},
 criteria:['Мини-проверка сдана','Задание принято наставником'],
 links:srcLinks('c9','col')
},
{
 id:'3.3', title:'Категории недвижимости', min:25,
 goal:'Понимать особенности каждого типа объекта: кому подходит, преимущества и риски.',
 why:'Иностранцу доступны не все форматы владения. Тип объекта определяет и юридическую схему, и доходность, и риски.',
 material:`
<table class="tbl"><tr><th>Тип</th><th>Кому подходит</th><th>Преимущества</th><th>Риски и особенности</th></tr>
<tr><td>Кондоминиум</td><td>Инвесторы, покупатели для отдыха</td><td>Иностранец может владеть на праве собственности (freehold) в пределах квоты 49%</td><td>Проверить квоту; платежи за обслуживание</td></tr>
<tr><td>Апартаменты / апарт-отель</td><td>Инвесторы в аренду</td><td>Управление отелем, программа аренды</td><td>Условия программы аренды, ограничения личного проживания</td></tr>
<tr><td>Вилла</td><td>Семьи, премиум</td><td>Простор, бассейн, приватность</td><td>Земля — не в собственности иностранца: лизхолд или другие схемы</td></tr>
<tr><td>Таунхаус</td><td>Для жизни, бюджетнее вилл</td><td>Цена ниже виллы</td><td>Как у вилл — права на землю</td></tr>
<tr><td>Новостройка (off-plan)</td><td>Инвесторы на рост, рассрочка</td><td>Цена ниже, рассрочка</td><td>Риск задержки стройки и застройщика</td></tr>
<tr><td>Вторичная недвижимость</td><td>Кто хочет «сейчас»</td><td>Видно готовый объект, сразу доход</td><td>Состояние, история, налоги продавца</td></tr>
<tr><td>Отельные и инвестиционные объекты</td><td>Крупные инвесторы</td><td>Доход от бизнеса</td><td>Нужен due diligence, управление</td></tr>
<tr><td>Земля</td><td>Девелоперы, долгосрочные инвесторы</td><td>Рост стоимости на горизонте лет</td><td>Иностранец не может владеть землёй напрямую; проверка документа на землю</td></tr></table>
<h3>Готовый объект или стройка</h3>
<p>Новые кондо в 2025 году стоили в среднем на 39% дороже вторичных (C9 Hotelworks: 139 000 против 100 000 бат/м²). Новостройка даёт рассрочку и новый объект, вторичка — готовый объект и иногда цену ниже.</p>`,
 example:`<p><b>Клиент:</b> «Хочу виллу в собственность». <b>Брокер:</b> «Иностранец в Таиланде не может владеть землёй напрямую. Виллы покупают через долгосрочную аренду земли или другие схемы — какая подходит вам, скажет наш юрист. Если важна именно собственность — посмотрите кондоминиум: там иностранец может быть собственником».</p>`,
 checklist:['Знаю 8 типов объектов','Знаю, где иностранцу доступна собственность (кондо в квоте 49%)','Объясняю разницу между готовым объектом и стройкой'],
 quiz:[
  {q:'В каком типе объекта иностранец может владеть на праве собственности (в пределах квоты)?', o:['Земля','Вилла с землёй','Кондоминиум','Таунхаус с землёй'], a:[2], e:'Квота 49% площади кондоминиума для иностранцев.'},
  {q:'Главный риск новостройки:', o:['Нет рассрочки','Задержка строительства и надёжность застройщика','Слишком новая','Нельзя сдавать'], a:[1], e:'Проверка застройщика — тема 3.4.'},
  {q:'На сколько новые кондо были дороже вторичных в 2025 году (C9)?', o:['На 5%','Примерно на 39%','В 3 раза','Дешевле'], a:[1], e:'139 000 против 100 000 бат/м².'}
 ],
 criteria:['Мини-проверка сдана'],
 links:srcLinks('c9','thg')
},
{
 id:'3.4', title:'Застройщики и девелоперские проекты', min:20,
 goal:'Уметь проверять застройщика и сравнивать проекты.',
 why:'Надёжность застройщика — главный риск при покупке новостройки.',
 material:`
<h3>Рынок застройщиков</h3>
<p>На I квартал 2025 года на Пхукете продавалось <b>40 600 объектов в 343 проектах</b>, из них 83% — кондоминиумы (C9 Hotelworks). Крупнейший по объёму предложения — RHOM Bho Property (4 820 юнитов в 9 проектах).</p>
<h3>Чек-лист проверки застройщика</h3>
<ol><li>Сколько лет на рынке, сколько проектов сдано и <b>вовремя ли</b>.</li>
<li>Можно ли посетить завершённые проекты и поговорить с владельцами.</li>
<li>Есть ли у проекта необходимые разрешения: на землю, строительство, экологическая экспертиза (EIA) для крупных проектов. Проверяет юрист.</li>
<li>Кто владеет землёй под проектом.</li>
<li>Есть ли эскроу или банковское сопровождение платежей. <span class="tbc">Уточнить у юриста, когда применимо.</span></li>
<li>Кто будет управлять объектом и на каких условиях.</li>
<li>Отзывы, судебные споры, новости.</li></ol>
<h3>Как сравнивать проекты</h3>
<table class="tbl"><tr><th>Критерий</th><th>Что смотреть</th></tr>
<tr><td>Локация</td><td>Район, расстояние до пляжа, шум</td></tr>
<tr><td>Застройщик</td><td>Чек-лист выше</td></tr>
<tr><td>Стадия</td><td>Котлован, каркас, отделка, готов</td></tr>
<tr><td>Цена за м²</td><td>Сравнение с рынком (тема 3.2)</td></tr>
<tr><td>Инфраструктура комплекса</td><td>Бассейн, фитнес, ресепшен, парковка</td></tr>
<tr><td>Управление и аренда</td><td>Кто управляет, условия, отчётность</td></tr>
<tr><td>Платежи</td><td>График, рассрочка, валюта</td></tr></table>`,
 example:`<p>Инвестор выбирает между двумя проектами в Bang Tao. Брокер составляет таблицу: у первого застройщика 5 сданных проектов, второй — новичок с первым проектом. Цена второго на 10% ниже. Брокер объясняет, что разница в цене — это плата за риск, и предлагает съездить на сданные объекты первого застройщика.</p>`,
 checklist:['Знаю 7 пунктов проверки застройщика','Сравниваю проекты по 7 критериям','Понимаю, что разрешения проверяет юрист'],
 quiz:[
  {q:'Что важнее всего проверить у застройщика новостройки?', o:['Цвет фасада','Историю сданных проектов и сроки сдачи','Количество рекламы','Логотип'], a:[1], e:'История сдачи — главный индикатор надёжности.'},
  {q:'Кто проверяет разрешения на землю и строительство?', o:['Брокер на глаз','Юрист','Клиент сам','Никто'], a:[1], e:'Юридическая проверка — юрист.'},
  {q:'Новый застройщик дешевле на 10%. Как объяснить клиенту?', o:['Это всегда выгоднее','Разница в цене — плата за риск; нужна дополнительная проверка','Это мошенники','Не объяснять'], a:[1], e:'Честно о рисках, без обвинений.'}
 ],
 criteria:['Мини-проверка сдана'],
 links:srcLinks('c9')
},
{
 id:'3.5', title:'Покупатели и инвесторы', min:25,
 goal:'Знать пять типичных портретов клиентов и подход к консультации каждого.',
 why:'Один и тот же объект подходит одному клиенту и совсем не подходит другому. Портрет помогает задать правильные вопросы.',
 material:`
<p class="muted">Портреты учебные; бюджеты — примерные сценарии, не данные компании.</p>
<table class="tbl"><tr><th>Портрет</th><th>Мотивация</th><th>Страхи и вопросы</th><th>Стратегия консультации</th></tr>
<tr><td><b>1. Инвестор в арендный доход</b><br><span class="muted">пример бюджета 150–400 тыс. $</span></td><td>Пассивный доход в валюте</td><td>«Какая реальная доходность?», «Кто будет управлять?», «Что если не сдаётся?»</td><td>Расчёт в 3 сценариях, управляющая компания, сезонность</td></tr>
<tr><td><b>2. Для собственного проживания</b><br><span class="muted">пример 200–600 тыс. $</span></td><td>Переезд, качество жизни</td><td>Школы, медицина, визы, безопасность</td><td>Районы для жизни, инфраструктура, юрист по визам</td></tr>
<tr><td><b>3. Для сезонного отдыха</b><br><span class="muted">пример 120–300 тыс. $</span></td><td>Свой дом у моря на зиму</td><td>Кто присмотрит, можно ли сдавать в остальное время</td><td>Управление и аренда в отсутствие владельца</td></tr>
<tr><td><b>4. Инвестор на перепродажу</b><br><span class="muted">пример 100–300 тыс. $</span></td><td>Рост цены от стройки до сдачи</td><td>Сроки стройки, ликвидность, налоги при продаже</td><td>Надёжный застройщик, расходы при выходе из объекта (SBT 3,3% при продаже в первые 5 лет владения)</td></tr>
<tr><td><b>5. Премиальный клиент</b><br><span class="muted">от 1 млн $</span></td><td>Статус, приватность, уникальность</td><td>Конфиденциальность, качество, сервис</td><td>Ограниченная подборка, личный сервис, встреча с руководством</td></tr></table>`,
 example:`<p><b>Клиент:</b> «Хочу вложиться, чтобы через два года продать дороже». Брокер определяет портрет №4 и сразу задаёт вопросы: «Какой срок держите деньги? Готовы ли к задержке стройки? Учитываем ли налог при перепродаже?»</p>`,
 checklist:['Знаю 5 портретов','Знаю главные страхи каждого','Подбираю стратегию консультации под портрет'],
 quiz:[
  {q:'Клиент хочет, чтобы квартира приносила доход, пока он в Москве. Портрет:', o:['Премиальный','Сезонный отдых / инвестор в аренду','Перепродажа','Земля'], a:[1], e:'Ключевое — управление и аренда в отсутствие владельца.'},

 why:'Инвестор принимает решение по цифрам. Честный расчёт со всеми расходами — главный инструмент доверия.',
 material:`
<h3>Термины</h3>
<table class="tbl"><tr><th>Термин</th><th>Что это</th><th>Формула</th></tr>
<tr><td>Стоимость покупки</td><td>Цена + расходы на оформление</td><td>Цена + налоги и сборы + мебель</td></tr>
<tr><td>Валовая доходность</td><td>Доход от аренды до расходов</td><td>Годовая аренда / стоимость × 100%</td></tr>
<tr><td>Чистая доходность</td><td>Доход после всех расходов</td><td>(Аренда − расходы) / стоимость × 100%</td></tr>
<tr><td>ROI за период</td><td>Сколько заработано на вложенный капитал</td><td>(Чистый доход + прирост цены) / вложения × 100%</td></tr>
<tr><td>Окупаемость</td><td>Лет до возврата вложений арендой</td><td>Стоимость / чистый доход в год</td></tr>
<tr><td>Загрузка</td><td>Доля ночей, когда объект сдан</td><td>Сданные ночи / 365</td></tr></table>
<h3>Расходы покупки (ориентиры)</h3>
<ul><li>Сбор за регистрацию перехода права — <b>2%</b> от оценочной стоимости; распределение между сторонами договорное, у застройщиков часто делится.</li>
<li>Налог на бизнес-операции (SBT) <b>3,3%</b> — платит продавец, если владел менее 5 лет; иначе гербовый сбор <b>0,5%</b>.</li>
<li>Подоходный налог продавца у источника — <span class="tbc">рассчитывает Земельный департамент; уточнить у юриста</span>.</li>
<li>Мебель и оснащение — если не включены.</li></ul>
<p class="muted">Источник: The Thaiger (обзор законодательства); подтверждается юристом для каждой сделки.</p>
<h3>Расходы владения</h3>
<p>Плата за обслуживание комплекса (sinking/common fee), коммунальные платежи, управление и комиссия управляющей компании, уборка, ремонт, страховка, налог на землю и постройки (для кондо — порядка 0,02% от оценочной стоимости). Валютный риск: доход в батах, а клиент считает в долларах или рублях.</p>
<h3>Рыночные ориентиры доходности</h3>
<p>Средняя <b>валовая</b> доходность апартаментов на Пхукете — <b>5,60%</b> (1-спальные 6,07%, 2-спальные 5,71%, 3-спальные 5,02%) по запрашиваемым ценам долгосрочной аренды; <b>чистая обычно на 1,5–2 п. п. ниже</b> (Global Property Guide, август 2026). Это не прогноз для конкретного объекта.</p>
<div class="claim">Все расчёты в обучении — учебные. Прогноз доходности — не гарантия. Клиенту всегда показываем минимум осторожный и базовый сценарии.</div>
<h3>Инвестиционный калькулятор</h3>
<div data-widget="invest"></div>`,
 example:`<p>Кондо 5 000 000 бат. Аренда 30 000 бат в месяц × 10 месяцев загрузки = 300 000 бат в год → валовая 6%. Расходы: обслуживание 40 000, управление 15% от аренды (45 000), прочее 20 000 = 105 000. Чистый доход 195 000 → чистая доходность 3,9%, окупаемость ≈ 25,6 года без учёта роста цены.</p>`,
 checklist:['Различаю валовую и чистую доходность','Знаю расходы покупки и владения','Считаю окупаемость','Показываю минимум два сценария'],

  {q:'Сбор за регистрацию перехода права в Таиланде:', o:['0,5%','2% от оценочной стоимости','10%','Отсутствует'], a:[1], e:'2%, распределение договорное.'},
  {q:'Средняя валовая доходность апартаментов на Пхукете (Global Property Guide, 2026):', o:['Около 15%','Около 5,6%','Около 50%','Около 1%'], a:[1], e:'5,60% валовая; чистая на 1,5–2 п. п. ниже.'}

 practice:{title:'Расчёт чистой доходности', task:'Посчитайте в калькуляторе объект: цена 6 500 000 бат, аренда 38 000 бат/мес, загрузка 75% (базовый сценарий), обслуживание 45 000 бат/год, управление 20% от аренды, прочие расходы 25 000 бат/год. Запишите валовую и чистую доходность и окупаемость в трёх сценариях и объясните клиенту результат в 3–4 предложениях без обещаний.', criteria:['Цифры посчитаны верно','Есть все три сценария','Объяснение без гарантий доходности','Названы риски: сезонность, валюта']},

{
 id:'3.7', title:'Юридические особенности покупки в Таиланде', min:35,
 goal:'Понимать базовые правила владения недвижимостью иностранцами, чтобы корректно объяснить их клиенту и вовремя подключить юриста.',
 why:'Ошибка в юридическом вопросе — самая дорогая ошибка брокера. Брокер объясняет общие принципы, а выводы по конкретной сделке делает юрист.',
 material:`
<div class="claim"><b>Это общая информация, не юридическая консультация.</b> Источник — обзор The Thaiger; каждая сделка проверяется юристом. <span class="tbc">Раздел утверждает юрист компании.</span></div>
<h3>Freehold и Leasehold</h3>
<table class="tbl"><tr><th></th><th>Freehold (собственность)</th><th>Leasehold (аренда)</th></tr>
<tr><td>Что это</td><td>Право собственности, бессрочно</td><td>Зарегистрированная аренда на срок</td></tr>
<tr><td>Для иностранца</td><td>Кондоминиум — в пределах квоты 49%</td><td>Земля и дома — максимальный срок <b>30 лет</b></td></tr>
<tr><td>Продление</td><td>—</td><td>По данным The Thaiger, после решения Верховного суда (март 2025) заранее согласованные автоматические продления недействительны: продление — только новой регистрацией с согласия собственника земли. <span class="tbc">Проверить юристом.</span></td></tr></table>
<h3>Кондоминиум: квота 49%</h3>
<ul><li>Иностранцы вместе могут владеть не более <b>49% продаваемой площади</b> здания (Закон о кондоминиумах 1979 г., ст. 19).</li>
<li>Перед задатком — письменное подтверждение квоты от управляющей компании здания (juristic person).</li>
<li>Деньги — в <b>иностранной валюте из-за рубежа</b> на имя покупателя с назначением «purchase of condominium». При переводе от 50 000 $ банк выдаёт форму FET; меньше — подтверждающее письмо банка.</li></ul>
<h3>Земля и дома</h3>
<ul><li>Иностранец не может владеть землёй.</li>
<li>Законные варианты: аренда на 30 лет, узуфрукт (пожизненное пользование), суперфиций (собственность на постройку без земли).</li>
<li><b>Номинальные тайские компании и «подставные» акционеры незаконны</b>; по данным The Thaiger, контроль ужесточён с 1 января 2026 года, наказание — до 3 лет лишения свободы и штраф до 1 млн бат. Брокер никогда не предлагает такие схемы.</li></ul>
<h3>Путь документов</h3>
<ol><li>Бронирование и договор резервирования.</li><li>Проверка объекта и застройщика юристом.</li><li>Договор купли-продажи.</li><li>Платежи по графику (для кондо — с документом о переводе валюты).</li><li>Регистрация в Земельном департаменте и уплата налогов и сборов.</li></ol>
<h3>Налоги и сборы</h3><p>См. тему 3.6: сбор 2%, SBT 3,3% или гербовый 0,5%, налог продавца у источника.</p>
<h3>Когда юрист обязателен</h3>
<p>Всегда: проверка права на объект и землю, договор, схема владения виллой, наследование, покупка на компанию, отель и земля.</p>
<h3>Правовой статус брокера</h3>
<p>Официальный портал Таиланда относит работу «брокера/агента» к занятиям, запрещённым для иностранцев. <span class="tbc">Схему работы брокеров компании подтверждает юрист.</span></p>`,
 example:`<p><b>Клиент:</b> «Мне сказали оформить виллу на тайскую компанию, где я владею 49%, а остальное — номиналы. Так можно?»</p><p><b>Брокер:</b> «Схемы с номинальными акционерами в Таиланде незаконны, и контроль за ними ужесточили. Мы такие варианты не используем. Есть законные способы — долгосрочная аренда земли, суперфиций. Предлагаю консультацию нашего юриста, он подберёт вариант под вашу ситуацию».</p>`,
 checklist:['Объясняю Freehold и Leasehold','Знаю квоту 49% и требование о переводе валюты','Знаю, что иностранец не владеет землёй','Знаю, что номинальные схемы незаконны','Знаю, когда обязательно подключать юриста'],
 quiz:[
  {q:'Максимальный срок зарегистрированной аренды земли:', o:['10 лет','30 лет','99 лет','Бессрочно'], a:[1], e:'30 лет; продление — новой регистрацией.'},
  {q:'Какую долю площади кондоминиума могут занимать иностранцы?', o:['100%','49%','25%','10%'], a:[1], e:'Квота 49% продаваемой площади.'},
  {q:'Клиент предлагает купить землю через компанию с номинальными акционерами. Ваш ответ:', o:['Хорошая идея','Это незаконно; предлагаю законные варианты и консультацию юриста','Не моё дело','Помогу найти номиналов'], a:[1], e:'Номинальные схемы незаконны.'}

 criteria:['Mini-check passed','The broker explains “full cycle” in their own words'],
